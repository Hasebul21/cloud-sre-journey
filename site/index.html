<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRE Notebook — APAC Study Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Source+Serif+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

<script>
// Cache-buster: re-pulls data.js / *.jsx whenever Vercel re-deploys.
// document.lastModified reflects index.html's Last-Modified header, which
// Vercel re-stamps on every build — so the ?v= changes per deploy but is
// stable within a deploy (ETag revalidation still works).
var __v = "?v=" + encodeURIComponent(document.lastModified);
document.write('<script src="data.js' + __v + '"><\/script>');
document.write('<script type="text/babel" src="components.jsx' + __v + '"><\/script>');
document.write('<script type="text/babel" src="views.jsx' + __v + '"><\/script>');
document.write('<script type="text/babel" src="app.jsx' + __v + '"><\/script>');
</script>
</body>
</html>
