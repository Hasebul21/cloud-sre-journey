<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRE Notebook — APAC Study Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ───────── Two-pane TOC — Linear / Notion / GitBook aesthetic ───────── */

:root {
  --ink: #1a1714;
  --ink-2: #5e5853;
  --ink-3: #9a948d;
  --line: #e3dfd6;
  --line-soft: #edeae2;
  --paper: #fbfaf6;
  --paper-2: #f3f1eb;
  --fill: #ece8de;
  --fill-2: #f3f1eb;
  --hand: #c8552c;
  --blue: #c8552c;
  --green: #3b7a3f;
  --green-soft: #e8efe5;
  --blue-soft: #fae8df;
  --warn: #a06b00;

  /* legacy var names some views may still reference */
  --red: var(--hand);
  --yellow: var(--warn);
  --ink-soft: var(--ink-2);
  --ink-faint: var(--ink-3);
  --paper-line: var(--line);
  --accent: var(--green);
  --shadow: none;

  --hover-tint: rgba(0,0,0,0.025);
  --tag-easy-fg: #2f5e0c;
  --tag-easy-bg: var(--green-soft);
  --tag-easy-bd: #b7cf9c;
  --tag-med-fg: var(--warn);
  --tag-med-bg: #fef9e0;
  --tag-med-bd: #e6c97a;
  --tag-hard-fg: var(--hand);
  --tag-hard-bg: #fcebe2;
  --tag-hard-bd: #d09b9b;
  --checked-fg: #fff;
}

:root[data-theme="dark"] {
  --ink: #ece7df;
  --ink-2: #b8b0a4;
  --ink-3: #7d7569;
  --line: #2d2925;
  --line-soft: #1f1c19;
  --paper: #16130f;
  --paper-2: #1d1a16;
  --fill: #25211c;
  --fill-2: #1f1c18;
  --hand: #e07a4e;
  --blue: #e07a4e;
  --green: #8ab877;
  --green-soft: #1f2a1c;
  --blue-soft: #2d1d14;
  --warn: #d4a35a;

  --hover-tint: rgba(255,255,255,0.04);
  --tag-easy-fg: #b6df9e;
  --tag-easy-bg: #1c2e18;
  --tag-easy-bd: #2f5e0c;
  --tag-med-fg: #e6c97a;
  --tag-med-bg: #2a230e;
  --tag-med-bd: #5e4d18;
  --tag-hard-fg: #ff8a5b;
  --tag-hard-bg: #2e1a14;
  --tag-hard-bd: #5e2a1a;
  --checked-fg: #0d1117;

  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 14.5px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

a { color: var(--blue); text-decoration: none; border-bottom: 1px solid transparent; }
a:hover { border-bottom-color: var(--blue); }

button {
  font: inherit;
  cursor: pointer;
  background: none;
  border: none;
  color: inherit;
  padding: 0;
}

/* ───────── App shell ───────── */

.app {
  display: grid;
  grid-template-columns: 256px 1fr;
  min-height: 100vh;
}

/* ───────── TOC sidebar ───────── */

.sidebar {
  background: var(--paper-2);
  border-right: 1px solid var(--line);
  padding: 0 0 24px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

.brand {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-weight: 700;
  font-size: 13.5px;
  padding: 18px 18px 14px;
  border-bottom: 1px solid var(--line);
  letter-spacing: -0.005em;
  color: var(--ink);
}
.brand .dot { color: var(--hand); }

.search {
  margin: 14px 14px 6px;
  height: 30px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 8px;
  font-size: 11.5px;
  color: var(--ink-3);
}
.search .kbd-hint {
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-size: 10px;
  background: var(--fill-2);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 1px 5px;
  color: var(--ink-2);
}

.nav { padding: 6px 0 0; display: flex; flex-direction: column; }

.nav-group-label {
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--ink-3);
  padding: 16px 18px 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 14px 5px 18px;
  font-size: 12.5px;
  line-height: 1.3;
  color: var(--ink-2);
  border-left: 2px solid transparent;
  width: 100%;
  text-align: left;
  transition: background .12s, color .12s;
}
.nav-item:hover { color: var(--ink); background: var(--hover-tint); }
.nav-item.active {
  background: var(--paper);
  color: var(--ink);
  font-weight: 600;
  border-left-color: var(--hand);
}
.nav-item .icon { display: none; }
.nav-item .mini-bar {
  margin-left: auto;
  font-size: 10px;
  color: var(--ink-3);
  font-weight: 600;
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  min-width: 24px;
  text-align: right;
}
.nav-item.active .mini-bar { color: var(--hand); }

.sidebar-foot {
  margin-top: auto;
  padding: 18px 18px 0;
  font-size: 11px;
  color: var(--ink-3);
  border-top: 1px solid var(--line);
  line-height: 1.5;
}
.sidebar-foot button {
  color: var(--blue);
  text-decoration: underline;
  font-size: inherit;
  margin-left: 4px;
}

/* ───────── Main content ───────── */

.main {
  padding: 36px 56px 96px;
  max-width: 920px;
}

.crumb {
  font-size: 11px;
  color: var(--ink-3);
  margin-bottom: 8px;
  letter-spacing: 0.01em;
}
.crumb .leaf { color: var(--ink); }

.page-head {
  margin-bottom: 22px;
  padding-bottom: 0;
  border: none;
}
.page-title {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.15;
  margin: 0 0 6px;
  color: var(--ink);
}
.page-sub {
  color: var(--ink-2);
  font-size: 13.5px;
  margin: 0;
  max-width: 640px;
  line-height: 1.55;
}

/* ───────── Section block (was tilted card) ───────── */

.section-card {
  background: transparent;
  border: none;
  padding: 0;
  margin: 0 0 28px;
  box-shadow: none;
  transform: none !important;
  position: static;
}
.section-card.tilted-l,
.section-card.tilted-r { transform: none !important; }
.section-card h2 {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 17px;
  font-weight: 600;
  margin: 0 0 6px;
  letter-spacing: -0.01em;
  line-height: 1.25;
  color: var(--ink);
}
.section-card h3 {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 13.5px;
  font-weight: 600;
  margin: 18px 0 8px;
  letter-spacing: -0.005em;
  color: var(--ink);
}
.section-card .lead {
  color: var(--ink-2);
  margin: 0 0 14px;
  font-size: 13.5px;
  line-height: 1.55;
}

/* ───────── Overall progress card (sidebar) ───────── */

.overall-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 10px 12px;
  margin: 0 14px 12px;
  box-shadow: none;
}
.overall-card h4 {
  margin: 0 0 4px;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* ───────── Progress bar ───────── */

.progress {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 6px 0 14px;
}
.progress-track {
  flex: 1;
  max-width: 360px;
  height: 6px;
  background: var(--fill);
  border: none;
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--green);
  background-image: none;
  transition: width .4s ease;
}
.progress-pct {
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-size: 12px;
  font-weight: 600;
  min-width: 36px;
  color: var(--ink);
}
.progress-frac {
  color: var(--ink-3);
  font-size: 11px;
  font-weight: 500;
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
}

/* ───────── Checklist ───────── */

.checklist { list-style: none; padding: 0; margin: 0; }
.checklist li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px solid var(--line-soft);
  font-size: 13.5px;
  transition: background .1s;
}
.checklist li:hover { background: var(--fill-2); }
.checklist li:last-child { border-bottom: none; }

.check {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  border: 1.2px solid var(--ink-3);
  border-radius: 3px;
  cursor: pointer;
  background: var(--paper);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 10px;
  font-weight: 700;
  color: transparent;
  line-height: 1;
  margin-top: 3px;
  transition: all .12s;
}
.check:hover { border-color: var(--ink); transform: none; }
.check.checked {
  background: var(--green);
  border-color: var(--green);
  color: var(--checked-fg);
}

.item-label {
  flex: 1;
  cursor: pointer;
  padding-top: 0;
  color: var(--ink);
}
.item-label.done {
  text-decoration: line-through;
  text-decoration-color: var(--ink-3);
  text-decoration-thickness: 1px;
  color: var(--ink-3);
}

/* ───────── Tag pills ───────── */

.tag {
  display: inline-block;
  padding: 1px 7px;
  font-size: 9.5px;
  font-weight: 600;
  border-radius: 3px;
  border: 1px solid;
  margin-left: 6px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
}
.tag-easy { color: var(--tag-easy-fg); border-color: var(--tag-easy-bd); background: var(--tag-easy-bg); }
.tag-medium { color: var(--tag-med-fg); border-color: var(--tag-med-bd); background: var(--tag-med-bg); }
.tag-hard { color: var(--tag-hard-fg); border-color: var(--tag-hard-bd); background: var(--tag-hard-bg); }
.tag-num {
  display: inline-block;
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-size: 11px;
  color: var(--ink-3);
  margin-right: 8px;
  min-width: 30px;
}

/* ───────── DSA grid ───────── */

.dsa-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 24px;
}
@media (max-width: 900px) { .dsa-grid { grid-template-columns: 1fr; } }

/* ───────── Stat row (overview) ───────── */

.stat-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 26px;
}
@media (max-width: 900px) { .stat-row { grid-template-columns: 1fr 1fr; } }

.stat {
  background: var(--paper);
  border: 1.2px solid var(--line);
  border-radius: 4px;
  padding: 14px;
  box-shadow: none;
  position: relative;
  overflow: hidden;
}
.stat .v {
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-size: 24px;
  font-weight: 500;
  line-height: 1;
  letter-spacing: -0.03em;
  margin-bottom: 6px;
  color: var(--ink);
}
.stat .v small {
  font-size: 12px;
  color: var(--ink-3);
  font-weight: 500;
}
.stat .l {
  font-size: 10px;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 600;
}
.stat .sub {
  font-size: 11px;
  color: var(--ink-3);
  margin-top: 4px;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
}
.stat.streak .v { color: var(--hand); }
.stat.streak::after { content: none; }

/* ───────── Habits ───────── */

.habit-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line-soft);
}
.habit-row:last-child { border: none; }
.habit-name {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 13.5px;
  font-weight: 500;
  flex: 1;
  color: var(--ink);
}
.habit-counter {
  display: flex;
  align-items: center;
  gap: 6px;
}
.habit-counter button {
  width: 24px;
  height: 24px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--paper);
  font-weight: 500;
  font-size: 13px;
  line-height: 1;
  color: var(--ink-2);
}
.habit-counter button:hover {
  background: var(--fill);
  border-color: var(--ink-2);
}
.habit-counter .num {
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-size: 14px;
  font-weight: 600;
  min-width: 50px;
  text-align: center;
  color: var(--ink);
}
.habit-counter .target { color: var(--ink-3); font-weight: 400; }

.week-strip { display: flex; gap: 3px; margin-left: 10px; }
.week-day {
  width: 18px;
  height: 18px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--paper);
  font-size: 9px;
  font-weight: 600;
  color: var(--ink-3);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
}
.week-day.done {
  background: var(--green);
  color: var(--checked-fg);
  border-color: var(--green);
}
.week-day.today { box-shadow: 0 0 0 1.5px var(--blue); }

/* ───────── Time log ───────── */

.time-log {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--ink-3);
  margin-left: 8px;
}
.time-log input {
  width: 44px;
  padding: 1px 4px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--paper);
  font: inherit;
  text-align: right;
  color: var(--ink);
}

/* ───────── Notes ───────── */

.notes {
  width: 100%;
  margin-top: 10px;
  padding: 10px 12px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 13px;
  line-height: 1.6;
  color: var(--ink);
  resize: vertical;
  min-height: 64px;
  outline: none;
}
.notes:focus { border-color: var(--blue); }

/* ───────── Country / generic tabs ───────── */

.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.tab {
  padding: 5px 12px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--paper);
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink-2);
  letter-spacing: 0.01em;
  box-shadow: none;
}
.tab:hover { border-color: var(--ink-2); }
.tab.active {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
  box-shadow: none;
}

.job-row {
  display: grid;
  grid-template-columns: 18px 1fr 110px 90px;
  gap: 10px;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--line-soft);
  font-size: 13px;
}
.job-row select {
  font: inherit;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 12px;
  padding: 3px 6px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--paper);
  color: var(--ink);
}

/* ───────── Doodles dropped ───────── */

.tape, .pin { display: none !important; }

.legend {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 11.5px;
  color: var(--ink-3);
  margin-bottom: 10px;
  letter-spacing: 0.01em;
}
.legend strong { color: var(--ink); }

.row-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
}
@media (max-width: 900px) { .row-grid-2 { grid-template-columns: 1fr; } }

.callout {
  border-left: 3px solid var(--green);
  padding: 10px 14px;
  background: var(--fill-2);
  border-radius: 0;
  margin: 14px 0;
  color: var(--ink-2);
  font-size: 12.5px;
  line-height: 1.55;
  font-style: normal;
}

.kbd {
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-size: 11px;
  background: var(--fill-2);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 1px 5px;
  color: var(--ink-2);
}

/* ───────── Dashboard subsection layout ───────── */

.dash-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  margin: 4px 0 20px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line-soft);
}
.dash-eyebrow {
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 600;
  margin-bottom: 6px;
}
.dash-title {
  margin: 0;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 30px;
  font-weight: 600;
  letter-spacing: -0.025em;
  color: var(--ink);
  line-height: 1.1;
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.dash-num {
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-weight: 500;
  letter-spacing: -0.04em;
  color: var(--ink);
}
.dash-slash {
  color: var(--ink-3);
  font-weight: 300;
}
.dash-name { font-weight: 600; }
.dash-sub {
  font-size: 13.5px;
  color: var(--ink-2);
  max-width: 640px;
  margin: 8px 0 0;
  line-height: 1.55;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--fill-2);
  border: 1px solid var(--line);
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-2);
  text-transform: lowercase;
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 4px;
}
.status-pill .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ink-3);
}
.status-pill.status-active { color: var(--hand); border-color: var(--blue-soft); background: var(--blue-soft); }
.status-pill.status-active .dot { background: var(--hand); }
.status-pill.status-done { color: var(--green); border-color: var(--green-soft); background: var(--green-soft); }
.status-pill.status-done .dot { background: var(--green); }

.stat-tiles {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 0 0 20px;
}
@media (max-width: 700px) { .stat-tiles { grid-template-columns: 1fr 1fr; } }
.stat-tile {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 11px 14px;
}
.stat-tile-label {
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--ink-3);
  margin-bottom: 5px;
}
.stat-tile-value {
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--ink);
}
.stat-tile-value.accent { color: var(--hand); }
.stat-tile-sub {
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-size: 11px;
  color: var(--ink-3);
  margin-top: 4px;
  font-weight: 500;
}

.list-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px 20px 12px;
  margin: 0 0 14px;
}
.list-section-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 14px;
  margin-bottom: 2px;
}
.list-section-head h2 {
  margin: 0;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.list-section-progress {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-size: 11px;
  color: var(--ink-3);
  font-weight: 500;
  white-space: nowrap;
}
.list-section-progress .pct {
  color: var(--ink);
  font-weight: 600;
  font-size: 12px;
}
.list-section .lead {
  font-size: 12px;
  color: var(--ink-3);
  margin: 4px 0 8px;
}

.playlist-group {
  margin: 14px 0 4px;
}
.playlist-group:first-of-type {
  margin-top: 10px;
}
.playlist-group + .playlist-group {
  border-top: 1px dashed var(--line);
  padding-top: 12px;
}
.playlist-group-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 6px;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
}
.playlist-group-title a {
  color: var(--ink);
  text-decoration: none;
  border-bottom: 1px dotted var(--ink-3);
}
.playlist-group-title a:hover {
  color: var(--hand);
  border-bottom-color: var(--hand);
}
.playlist-group-count {
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-3);
  margin-left: auto;
}

.sparkbar {
  display: inline-flex;
  align-items: flex-end;
  gap: 2px;
  height: 12px;
}
.sparkbar-tick {
  width: 2px;
  height: 6px;
  background: var(--line);
  border-radius: 1px;
  transition: background .12s, height .12s;
}
.sparkbar-tick:nth-child(3n)   { height: 8px; }
.sparkbar-tick:nth-child(4n+1) { height: 10px; }
.sparkbar-tick.on { background: var(--hand); }

.notes-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px 20px;
  margin: 0 0 4px;
}
.notes-section .list-section-head { margin-bottom: 8px; }
.notes-section .notes {
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-size: 12px;
  background: var(--fill-2);
  min-height: 96px;
  line-height: 1.55;
}

/* ───────── AI Engineering · 4 level tiles + stacked level cards ───────── */

.level-tiles {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 0 0 20px;
}
@media (max-width: 700px) { .level-tiles { grid-template-columns: 1fr 1fr; } }
.level-tile {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 12px 14px 14px;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: border-color .12s, background .12s;
}
.level-tile:hover { border-color: var(--ink-3); background: var(--fill-2); border-bottom: 1px solid var(--ink-3); }
.level-tile-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
}
.level-tile-num {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
}
.level-tile-pct {
  font-size: 14px;
  font-weight: 600;
  color: var(--hand);
}
.level-tile-name {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 12px;
  color: var(--ink-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.level-card-v2 {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 18px 20px 14px;
  margin: 0 0 14px;
  scroll-margin-top: 18px;
}
.level-card-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  margin-bottom: 2px;
}
.level-card-title {
  display: flex;
  align-items: baseline;
  gap: 9px;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--ink);
}
.level-card-num {
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-weight: 500;
  letter-spacing: -0.03em;
}
.level-card-slash { color: var(--ink-3); font-weight: 300; }
.level-card-v2 > .lead {
  font-size: 13px;
  color: var(--ink-2);
  margin: 4px 0 14px;
  line-height: 1.55;
}
.level-card-v2 .list-section {
  background: transparent;
  border: none;
  padding: 8px 0 0;
  margin: 0;
}
.level-card-v2 .list-section + .list-section {
  border-top: 1px dashed var(--line);
  margin-top: 8px;
  padding-top: 10px;
}

/* ───────── Mobile ───────── */

@media (max-width: 800px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: relative;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--line);
  }
  .main {
    padding: 22px 18px 60px;
    max-width: 100%;
  }
  .page-title { font-size: 24px; }
}

<script type="text/babel">
// Shared components + hooks for the SRE dashboard.
// Storage helpers: each item lives under "sre:" + id.

const { useState, useEffect, useMemo, useRef, useCallback } = React;

const STORAGE_PREFIX = "sre:";

function loadJSON(key, fallback) {
  try {
    const v = localStorage.getItem(STORAGE_PREFIX + key);
    if (v === null) return fallback;
    return JSON.parse(v);
  } catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value)); }
  catch (e) {}
}

// Hook: localStorage-backed state
function useStored(key, fallback) {
  const [v, setV] = useState(() => loadJSON(key, fallback));
  useEffect(() => { saveJSON(key, v); }, [key, v]);
  return [v, setV];
}

// Global "done" set across all items — one key per group, with cross-instance
// sync so multiple <Checklist> components sharing the same group stay in step.
// (Previously a write from instance B could clobber instance A's recent toggle
// because B's React state was stale relative to localStorage.)
function useDoneSet(group) {
  const key = "done:" + group;
  const [set, setSet] = useState(() => loadJSON(key, {}));

  // Listen for activity events from sibling instances of the same group and
  // re-read from localStorage so all instances see the latest state.
  useEffect(() => {
    const sync = (e) => {
      if (e && e.detail && e.detail.group === group) {
        setSet(loadJSON(key, {}));
      }
    };
    window.addEventListener("sre:activity", sync);
    return () => window.removeEventListener("sre:activity", sync);
  }, [group, key]);

  const toggle = useCallback((id) => {
    setSet(prev => {
      const next = { ...prev };
      if (next[id]) delete next[id]; else next[id] = Date.now();
      // Persist synchronously so other instances see fresh data when the
      // activity event fires.
      saveJSON(key, next);
      // Defer the event to a microtask so React has finished the commit
      // before siblings re-read state.
      Promise.resolve().then(() => {
        window.dispatchEvent(new CustomEvent("sre:activity", { detail: { id, group, done: !!next[id] } }));
      });
      return next;
    });
  }, [key, group]);

  return [set, toggle];
}

// ───────── Progress bar ─────────
function Progress({ done, total, label }) {
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  return (
    <div className="progress">
      <div className="progress-pct">{pct}%</div>
      <div className="progress-track">
        <div className="progress-fill" style={{ width: pct + "%" }}></div>
      </div>
      <div className="progress-frac">{done} / {total}{label ? " " + label : ""}</div>
    </div>
  );
}

// ───────── Tag (difficulty etc) ─────────
function Tag({ level }) {
  if (!level) return null;
  const cls = "tag tag-" + level.toLowerCase();
  return <span className={cls}>{level}</span>;
}

// ───────── Checklist ─────────
function Checklist({ items, group, renderItem }) {
  const [done, toggle] = useDoneSet(group);
  // Clicks that land on (or inside) a link should navigate, not toggle.
  const onLabelClick = (e, id) => {
    if (e.target.closest && e.target.closest("a")) return;
    toggle(id);
  };
  return (
    <ul className="checklist">
      {items.map(it => {
        const isDone = !!done[it.id];
        return (
          <li key={it.id}>
            <div
              className={"check " + (isDone ? "checked" : "")}
              onClick={() => toggle(it.id)}
              role="checkbox"
              aria-checked={isDone}
            >
              {isDone ? "✓" : ""}
            </div>
            <div
              className={"item-label " + (isDone ? "done" : "")}
              onClick={(e) => onLabelClick(e, it.id)}
            >
              {renderItem ? renderItem(it, isDone) : it.name}
            </div>
          </li>
        );
      })}
    </ul>
  );
}

// ───────── Section card with auto progress ─────────
function SectionCard({ title, lead, items, group, renderItem, tilted, children }) {
  const [done] = useDoneSet(group);
  const completed = items ? items.filter(it => done[it.id]).length : 0;
  const total = items ? items.length : 0;
  const tiltClass = tilted === "left" ? "tilted-l" : tilted === "right" ? "tilted-r" : "";
  return (
    <section className={"section-card " + tiltClass}>
      {title && <h2>{title}</h2>}
      {lead && <p className="lead">{lead}</p>}
      {items && <Progress done={completed} total={total} />}
      {items && <Checklist items={items} group={group} renderItem={renderItem} />}
      {children}
    </section>
  );
}

// ───────── Notes (per section, persists) ─────────
function Notes({ id, placeholder }) {
  const [v, setV] = useStored("notes:" + id, "");
  return (
    <textarea
      className="notes"
      value={v}
      onChange={(e) => setV(e.target.value)}
      placeholder={placeholder || "Scribble notes, gotchas, links…"}
    />
  );
}

// ───────── Time log (hours per group) ─────────
function TimeLog({ id }) {
  const [hours, setHours] = useStored("time:" + id, 0);
  return (
    <span className="time-log">
      ⏱
      <input
        type="number"
        min="0"
        step="0.5"
        value={hours}
        onChange={(e) => setHours(parseFloat(e.target.value) || 0)}
      /> hrs logged
    </span>
  );
}

// ───────── Streak engine ─────────
// Tracks days with any activity. Streak = consecutive days ending today (or yesterday).
function todayKey(d = new Date()) {
  return d.toISOString().slice(0, 10);
}
function useStreak() {
  const [days, setDays] = useStored("activity-days", {}); // {YYYY-MM-DD: true}
  useEffect(() => {
    function onAct() {
      const k = todayKey();
      setDays(prev => prev[k] ? prev : { ...prev, [k]: true });
    }
    window.addEventListener("sre:activity", onAct);
    return () => window.removeEventListener("sre:activity", onAct);
  }, [setDays]);

  const { streak, longest } = useMemo(() => {
    const ks = Object.keys(days).sort();
    if (ks.length === 0) return { streak: 0, longest: 0 };
    const set = new Set(ks);
    // current streak
    let s = 0;
    let cursor = new Date();
    if (!set.has(todayKey(cursor))) cursor.setDate(cursor.getDate() - 1);
    while (set.has(todayKey(cursor))) {
      s++;
      cursor.setDate(cursor.getDate() - 1);
    }
    // longest streak
    let best = 0, run = 1;
    for (let i = 1; i < ks.length; i++) {
      const prev = new Date(ks[i-1]);
      prev.setDate(prev.getDate() + 1);
      if (todayKey(prev) === ks[i]) { run++; } else { best = Math.max(best, run); run = 1; }
    }
    best = Math.max(best, run);
    return { streak: s, longest: best };
  }, [days]);

  return { days, streak, longest };
}

// ───────── Compute aggregate progress across all groups ─────────
function useAllProgress() {
  // collect all item ids by group from SRE_DATA
  const groups = useMemo(() => buildGroupIndex(SRE_DATA), []);
  // re-read on storage events
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const onStorage = () => setTick(t => t + 1);
    const onAct = () => setTick(t => t + 1);
    window.addEventListener("storage", onStorage);
    window.addEventListener("sre:activity", onAct);
    return () => {
      window.removeEventListener("storage", onStorage);
      window.removeEventListener("sre:activity", onAct);
    };
  }, []);
  const summary = useMemo(() => {
    const out = {};
    let allDone = 0, allTotal = 0;
    for (const [g, ids] of Object.entries(groups)) {
      const done = loadJSON("done:" + g, {});
      const d = ids.filter(id => done[id]).length;
      out[g] = { done: d, total: ids.length };
      allDone += d;
      allTotal += ids.length;
    }
    return { groups: out, total: allTotal, done: allDone };
  }, [groups, tick]);
  return summary;
}

// Map each group → array of item ids (for aggregate stats)
function buildGroupIndex(D) {
  const g = {};
  g.sdConcepts = D.sysDesignConcepts.map(i => i.id);
  g.sdDeep = D.sysDesignDeepDives.map(i => i.id);
  g.sdWalk = D.sysDesignWalkthroughs.map(i => i.id);
  g.sdPlaylists = D.sdPlaylists.flatMap(i => i.videos ? i.videos.map(v => v.id) : (i.id ? [i.id] : []));
  g.sdChannels = D.sdChannels.map(i => i.id);
  g.sdReading = D.sdReading.map(i => i.id);
  g.star = D.starStories.map(i => i.id);
  g.lldV = D.lldVideos.map(i => i.id);
  g.lldP = D.lldPractice.map(i => i.id);
  g.sqlC = D.sqlConcepts.map(i => i.id);
  g.sqlP = D.sqlProblems.map(i => i.id);
  g.dsa = D.dsaTopics.flatMap(t => t.items.map(i => i.id));
  g.phase = D.phases.flatMap(p => p.tasks.map(i => i.id));
  g.goPath = D.goPath.map(i => i.id);
  g.otherSk = D.otherSkills.map(i => i.id);
  g.loop = D.loopRounds.map(i => i.id);
  g.qAsk = D.questionsToAsk.map(i => i.id);
  g.repos = D.repos.map(i => i.id);
  g.blog = D.blogIdeas.map(i => i.id);
  g.certs = D.certs.map(i => i.id);
  g.books = D.books.map(i => i.id);
  g.courses = D.courses.map(i => i.id);
  // SRE Learning sections (each view has resources + milestones)
  if (D.sreRoadmap) {
    for (const [key, sec] of Object.entries(D.sreRoadmap)) {
      g["sreLr_" + key] = sec.resources.map(i => i.id);
      g["sreLm_" + key] = sec.milestones.map(i => i.id);
    }
  }
  return g;
}

// Combined per-view ids (used by the sidebar mini progress)
function viewGroups() {
  return {
    overview: [],
    "p0-sd": ["sdConcepts","sdDeep","sdWalk","sdPlaylists","sdChannels","sdReading"],
    "p0-behavior": ["star"],
    "p0-lld": ["lldV","lldP"],
    "p0-sql": ["sqlC","sqlP"],
    "p0-dsa": ["dsa"],
    "sre-fnd":   ["sreLr_foundations",  "sreLm_foundations"],
    "sre-cod":   ["sreLr_coding",       "sreLm_coding"],
    "sre-cloud": ["sreLr_cloud",        "sreLm_cloud"],
    "sre-auto":  ["sreLr_automation",   "sreLm_automation"],
    "sre-rel":   ["sreLr_reliability",  "sreLm_reliability"],
    "sre-varnish": ["sreLr_varnish",    "sreLm_varnish"],
    "part-ai":   ["sreLr_ai-l1","sreLm_ai-l1","sreLr_ai-l2","sreLm_ai-l2","sreLr_ai-l3","sreLm_ai-l3","sreLr_ai-l4","sreLm_ai-l4"],
    "part-b": ["phase"],
    "part-e": ["goPath","otherSk"],
    "part-g": [], // tracked via job-status
    "part-h": ["loop","qAsk","star"],
    "part-i": ["repos","blog","certs"],
    "part-j": ["books","courses"],
  };
}

// expose globally
Object.assign(window, {
  loadJSON, saveJSON, useStored, useDoneSet,
  Progress, Tag, Checklist, SectionCard, Notes, TimeLog,
  useStreak, useAllProgress, viewGroups, buildGroupIndex,
  todayKey,
});

</script>

      <div>

// ───────── PART G — APAC Jobs ─────────
function PartGView() {
  const countries = Object.keys(D.jobsByCountry);
  const [country, setCountry] = useStored("ui:job-country", countries[0]);
  const [jobs, setJobs] = useStored("jobs", {});
  const stages = ["Not yet", "Saved", "Applied", "Phone screen", "Interview", "Offer", "Rejected"];

  const setStage = (key, stage) => setJobs(prev => ({ ...prev, [key]: { ...(prev[key] || {}), stage } }));
  const toggleStar = (key) => setJobs(prev => ({ ...prev, [key]: { ...(prev[key] || {}), starred: !(prev[key]?.starred) } }));

  const counts = useMemo(() => {
    const out = { applied: 0, interview: 0, offer: 0 };
    Object.values(jobs).forEach(j => {
      const s = j.stage;
      if (s === "Applied" || s === "Phone screen" || s === "Interview") out.applied++;
      if (s === "Phone screen" || s === "Interview") out.interview++;
      if (s === "Offer") out.offer++;
    });
    return out;
  }, [jobs]);

  return (
    <div>
      <div className="page-head">
        <h1 className="page-title">Part G · APAC Job Search</h1>
        <p className="page-sub">Track each company through the pipeline. Star your top targets. Apply early, refer often.</p>
      </div>

      <div className="stat-row" style={{gridTemplateColumns: "repeat(3, 1fr)"}}>
        <div className="stat"><div className="v">{counts.applied}</div><div className="l">In pipeline</div></div>
        <div className="stat"><div className="v">{counts.interview}</div><div className="l">Interviewing</div></div>
        <div className="stat"><div className="v">{counts.offer}</div><div className="l">Offers</div></div>
      </div>

      <section className="section-card">
        <div className="tabs">
          {countries.map(c => (
            <button key={c} className={"tab " + (c === country ? "active" : "")} onClick={() => setCountry(c)}>{c}</button>
          ))}
        </div>
        <p className="legend">★ to mark a top target · drop-down sets stage</p>

        <div>
          {D.jobsByCountry[country].map(([name, url]) => {
            const key = country + ":" + name;
            const j = jobs[key] || {};
            return (
              <div key={key} className="job-row">
                <button title="Star" onClick={() => toggleStar(key)} style={{fontSize: 20, color: j.starred ? "var(--yellow)" : "var(--ink-faint)"}}>{j.starred ? "★" : "☆"}</button>
                <div><a href={url} target="_blank" rel="noopener">{name}</a></div>
                <select value={j.stage || "Not yet"} onChange={e => setStage(key, e.target.value)}>
                  {stages.map(s => <option key={s}>{s}</option>)}
                </select>
                <span style={{fontSize: 14, color: "var(--ink-faint)"}}>{j.stage === "Offer" ? "🎉" : j.stage === "Rejected" ? "—" : ""}</span>
              </div>
            );
          })}
        </div>
      </section>
    </div>
  );
}

          <p style={{color: "var(--ink-faint)", fontStyle: "italic"}}>No mocks logged yet. First one is the hardest.</p>
        ) : (
          <ul className="checklist">
            {mocks.map(m => (
              <li key={m.id}>
                <span style={{fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, fontWeight: 500, color: "var(--blue)", minWidth: 110}}>{m.date}</span>

        <p className="page-sub">Books + courses to grind through. Tick when finished — or when "good enough for interviews".</p>
      </div>

      <SectionCard title="Must-read books"
        items={D.books}
        group="books"
        tilted="left"
        renderItem={(it) => (
          <span>
            <ResourceTag type="book" />
            {it.url ? <a href={it.url} target="_blank" rel="noopener">{it.name}</a> : <span>{it.name}</span>}
          </span>
        )}
      >
        <TimeLog id="books" />
        <Notes id="books" placeholder="Chapter notes, favorite passages, what to revisit." />
      </SectionCard>

      <SectionCard title="Courses"
        items={D.courses}
        group="courses"
        tilted="right"
        renderItem={(it) => (
          <span>
            <ResourceTag type="course" />
            {it.url ? <a href={it.url} target="_blank" rel="noopener">{it.name}</a> : <strong>{it.name}</strong>}
            <span style={{color:"var(--ink-faint)", marginLeft:8, fontSize:13}}>{it.plat} · {it.cost}</span>
          </span>
        )}
      />

      <section className="section-card">
        <h2>Practice platforms</h2>
        <ul className="checklist">
          {[
            ["NeetCode", "neetcode.io", "FREE"],
            ["LeetCode Premium", "leetcode.com", "$35/mo"],
            ["Pramp", "pramp.com", "FREE peer mocks"],
            ["interviewing.io", "interviewing.io", "$200–400/session"],
            ["Hello Interview", "hellointerview.com", "Freemium"],
            ["killer.sh", "killer.sh", "CKA simulator"],
          ].map(([n, u, c]) => (
            <li key={n}>
              <div className="check"></div>
              <div className="item-label"><a href={"https://"+u} target="_blank" rel="noopener"><strong>{n}</strong></a> <span style={{color:"var(--ink-faint)", marginLeft:8, fontSize:13}}>{c}</span></div>
            </li>
          ))}
        </ul>
      </section>
    </div>
  );
}

// ───────── SRE LEARNING (the curated path: foundations → reliability) ─────────

function ResourceTag({ type }) {
  const map = {
    video:    { l: "VIDEO",    bg: "#fcebe2", c: "var(--red)" },
    course:   { l: "COURSE",   bg: "#dfeefb", c: "var(--blue)" },
    book:     { l: "BOOK",     bg: "#e3f1da", c: "var(--green)" },
    blog:     { l: "BLOG",     bg: "#fef9e0", c: "#9a6c00" },
    playlist: { l: "PLAYLIST", bg: "#fcebe2", c: "var(--red)" },
    channel:  { l: "CHANNEL",  bg: "#f0e6ff", c: "#6b3aa1" },
    github:   { l: "GITHUB",   bg: "#e8eaed", c: "#1f2328" },
  };
  const s = map[type] || { l: "RES", bg: "#eee", c: "#666" };
  return (
    <span
      className="tag"
      style={{ background: s.bg, color: s.c, borderColor: s.c, marginRight: 8, marginLeft: 0 }}
    >{s.l}</span>
  );
}

const STAGE_NUM = {
  foundations: "01",
  coding:      "02",
  cloud:       "03",
  automation:  "04",
  reliability: "05",
  varnish:     "06",
};

function StatusPill({ pct }) {
  let label = "not started", cls = "neutral";
  if (pct >= 100) { label = "complete"; cls = "done"; }
  else if (pct > 0) { label = "in progress"; cls = "active"; }
  return (
    <span className={"status-pill status-" + cls}>
      <span className="dot" /> {label}
    </span>
  );
}

function StatTile({ label, value, sub, accent }) {
  return (
    <div className="stat-tile">
      <div className="stat-tile-label">{label}</div>
      <div className={"stat-tile-value" + (accent ? " accent" : "")}>{value}</div>
      {sub && <div className="stat-tile-sub">{sub}</div>}
    </div>
  );
}

function Sparkbar({ pct, bars = 14 }) {
  const filled = Math.round(bars * pct / 100);
  return (
    <span className="sparkbar">
      {Array.from({ length: bars }).map((_, i) => (
        <span key={i} className={"sparkbar-tick" + (i < filled ? " on" : "")} />
      ))}
    </span>
  );
}

function ListSection({ title, lead, done, total, children }) {
  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  return (
    <section className="list-section">
      <div className="list-section-head">
        <h2>{title}</h2>
        <div className="list-section-progress">
          <Sparkbar pct={pct} />
          <span className="pct">{pct}%</span>
          <span className="frac">{done}/{total}</span>
        </div>
      </div>
      {lead && <p className="lead">{lead}</p>}
      {children}
    </section>
  );
}

function SreLearningView({ sectionKey }) {
  const section = D.sreRoadmap[sectionKey];
  if (!section) return null;
  const resGroup = "sreLr_" + sectionKey;
  const milGroup = "sreLm_" + sectionKey;
  const resDoneSet = useDoneSet(resGroup)[0];
  const milDoneSet = useDoneSet(milGroup)[0];
  const resDone = section.resources.filter(r => resDoneSet[r.id]).length;
  const milDone = section.milestones.filter(m => milDoneSet[m.id]).length;
  const total = section.resources.length + section.milestones.length;
  const done = resDone + milDone;
  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  const [hoursLogged] = useStored("time:" + resGroup, 0);

  // Existing titles look like "SRE 1 · Foundations" — pull the stage name out
  // and prefix with a clean two-digit number to match the redesign mocks.
  const stageName = section.title.split(" · ").slice(-1)[0];
  const stageNum = STAGE_NUM[sectionKey] || "··";

  const renderResource = (it) => (
    <span>
      <ResourceTag type={it.type} />
      {it.url ? (
        <a href={it.url} target="_blank" rel="noopener">{it.name}</a>
      ) : <span>{it.name}</span>}
    </span>
  );

  return (
    <div>
      <div className="dash-head">
        <div>
          <div className="dash-eyebrow">stage</div>
          <h1 className="dash-title">
            <span className="dash-num">{stageNum}</span>
            <span className="dash-slash">/</span>
            <span className="dash-name">{stageName}</span>
          </h1>
          <p className="dash-sub">{section.intro}</p>
        </div>
        <StatusPill pct={pct} />
      </div>

      <div className="stat-tiles">
        <StatTile label="Complete" value={pct + "%"} sub={done + " of " + total} accent />
        <StatTile label="Resources" value={resDone + "/" + section.resources.length}
          sub={Math.round(resDone / section.resources.length * 100) + "%"} />
        <StatTile label="Milestones" value={milDone + "/" + section.milestones.length}
          sub={section.milestones.length > 0 ? Math.round(milDone / section.milestones.length * 100) + "%" : "0%"} />
        <StatTile label="Time" value={hoursLogged + "h"} sub="logged" />
      </div>

      {section.why && <div className="callout">{section.why}</div>}

      <ListSection title="Curated resources" lead="Videos, courses, books, blogs. Tick when worked through (or honestly skipped)."
        done={resDone} total={section.resources.length}>
        <Checklist items={section.resources} group={resGroup} renderItem={renderResource} />
      </ListSection>

      <ListSection title="Hands-on milestones" lead="Tick only when actually shipped."
        done={milDone} total={section.milestones.length}>
        <Checklist items={section.milestones} group={milGroup} />
      </ListSection>

      <section className="notes-section">
        <div className="list-section-head">
          <h2>Notes</h2>
          <TimeLog id={resGroup} />
        </div>
        <Notes id={milGroup} placeholder="Links to commits, screenshots, gotchas, things to come back to." />
      </section>
    </div>
  );
}

const SRE_FoundationsView = () => <SreLearningView sectionKey="foundations" />;
const SRE_CodingView      = () => <SreLearningView sectionKey="coding" />;
const SRE_CloudView       = () => <SreLearningView sectionKey="cloud" />;
const SRE_AutomationView  = () => <SreLearningView sectionKey="automation" />;
const SRE_ReliabilityView = () => <SreLearningView sectionKey="reliability" />;
const SRE_VarnishView     = () => <SreLearningView sectionKey="varnish" />;

// Part AI renders 4 difficulty levels on one page (sourced from sreRoadmap.ai-l1..l4)
function AILevelCard({ levelNum, sectionKey }) {
  const D = window.SRE_DATA;
  const sec = D.sreRoadmap[sectionKey];
  const milGroup = "sreLm_" + sectionKey;
  const resGroup = "sreLr_" + sectionKey;
  const milDoneSet = useDoneSet(milGroup)[0];
  const resDoneSet = useDoneSet(resGroup)[0];
  const milDone = sec.milestones.filter(m => milDoneSet[m.id]).length;
  const resDone = sec.resources.filter(r => resDoneSet[r.id]).length;
  const milTotal = sec.milestones.length;
  const resTotal = sec.resources.length;

  // Level title: data has "AI · Level 1 — Foundations" → use the part after "— "
  const levelTail = sec.title.split(" — ").slice(-1)[0];

  const renderResource = (it) => (
    <span>
      <ResourceTag type={it.type} />
      {it.url ? (
        <a href={it.url} target="_blank" rel="noopener">{it.name}</a>
      ) : <span>{it.name}</span>}
    </span>
  );

  return (
    <section id={"ai-l" + levelNum} className="level-card-v2">
      <div className="level-card-head">
        <div className="level-card-title">
          <span className="level-card-num">L{levelNum}</span>
          <span className="level-card-slash">/</span>
          <span className="level-card-name">{levelTail}</span>
        </div>
        <StatusPill pct={milTotal > 0 ? Math.round(milDone / milTotal * 100) : 0} />
      </div>
      <p className="lead">{sec.intro}</p>

      <ListSection title="Milestones" done={milDone} total={milTotal}>
        <Checklist items={sec.milestones} group={milGroup} />
      </ListSection>

      <ListSection title="Resources" done={resDone} total={resTotal}>
        <Checklist items={sec.resources} group={resGroup} renderItem={renderResource} />
      </ListSection>
    </section>
  );
}

function LevelTile({ levelNum, sectionKey }) {
  const D = window.SRE_DATA;
  const sec = D.sreRoadmap[sectionKey];
  const milGroup = "sreLm_" + sectionKey;
  const milDoneSet = useDoneSet(milGroup)[0];
  const done = sec.milestones.filter(m => milDoneSet[m.id]).length;
  const total = sec.milestones.length;
  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  const target = "ai-l" + levelNum;
  // Map data title "AI · Level 1 — Foundations" → "Foundations"
  const levelTail = sec.title.split(" — ").slice(-1)[0];

  return (
    <a href={"#" + target} className="level-tile" onClick={(e) => {
      e.preventDefault();
      document.getElementById(target)?.scrollIntoView({behavior: "smooth", block: "start"});
    }}>
      <div className="level-tile-head">
        <span className="level-tile-num">L{levelNum}</span>
        <span className="level-tile-pct">{pct}%</span>
      </div>
      <div className="level-tile-name">{levelTail}</div>
      <Sparkbar pct={pct} bars={18} />
    </a>
  );
}

function PartAIView() {
  const D = window.SRE_DATA;
  const levelKeys = ["ai-l1", "ai-l2", "ai-l3", "ai-l4"];

  // Aggregate progress across all 4 levels
  const allMilDone = ["sreLm_ai-l1","sreLm_ai-l2","sreLm_ai-l3","sreLm_ai-l4"]
    .reduce((s, g) => s + Object.keys(loadJSON("done:" + g, {})).length, 0);
  const allMilTotal = levelKeys.reduce((s, k) => s + D.sreRoadmap[k].milestones.length, 0);
  const allPct = allMilTotal > 0 ? Math.round(allMilDone / allMilTotal * 100) : 0;

  return (
    <div>
      <div className="dash-head">
        <div>
          <div className="dash-eyebrow">specialization</div>
          <h1 className="dash-title">
            <span className="dash-num">AI</span>
            <span className="dash-slash">/</span>
            <span className="dash-name">Engineering</span>
          </h1>
          <p className="dash-sub">A horizontal specialization. AI engineering — using pre-trained models in production — not ML research.</p>
        </div>
        <StatusPill pct={allPct} />
      </div>

      <div className="callout">
        Sources: <a href="https://roadmap.sh/ai-engineer" target="_blank" rel="noopener">roadmap.sh/ai-engineer</a> · <a href="https://github.com/krishnaik06/Roadmap-To-Learn-Agentic-AI" target="_blank" rel="noopener">Krishna Naik — Agentic AI</a> · <em>AI Engineering</em> by Chip Huyen.
      </div>

      <div className="level-tiles">
        {levelKeys.map((key, idx) => (
          <LevelTile key={key} levelNum={idx + 1} sectionKey={key} />
        ))}
      </div>

      {levelKeys.map((key, idx) => (
        <AILevelCard key={key} levelNum={idx + 1} sectionKey={key} />
      ))}
    </div>
  );
}

Object.assign(window, {
  OverviewView, P0_SysDesignView, P0_BehaviorView, P0_LLDView, P0_SQLView,
  P0_DSAView, PartAIView, PartBView, PartEView,
  PartGView, PartHView, PartIView, PartJView,
  SRE_FoundationsView, SRE_CodingView, SRE_CloudView, SRE_AutomationView, SRE_ReliabilityView,
  SRE_VarnishView,
});

</script>

<script type="text/babel">
// App shell — two-pane TOC. Persists current view in URL hash.

const NAV = [
  { id: "_learn", label: "Learn", group: "section" },
  { id: "sre-fnd",      label: "01 · Foundations",      crumb: "Learn / 01 · Foundations",             group: "learn" },
  { id: "sre-cod",      label: "02 · Coding",           crumb: "Learn / 02 · Coding",                  group: "learn" },
  { id: "sre-cloud",    label: "03 · Cloud & K8s",      crumb: "Learn / 03 · Cloud & K8s",             group: "learn" },
  { id: "sre-auto",     label: "04 · Automation",       crumb: "Learn / 04 · Automation",              group: "learn" },
  { id: "sre-rel",      label: "05 · Reliability",      crumb: "Learn / 05 · Reliability",             group: "learn" },
  { id: "sre-varnish",  label: "06 · Varnish & VCL",    crumb: "Learn / 06 · Varnish & VCL",           group: "learn" },
  { id: "p0-sd",        label: "System Design",         crumb: "Learn / System Design",                group: "learn" },
  { id: "part-ai",      label: "AI Engineering",        crumb: "Learn / AI Engineering",               group: "learn" },

  { id: "_practice", label: "Practice", group: "section" },
  { id: "p0-behavior",  label: "Behavioral",            crumb: "Practice / Behavioral",                group: "practice" },
  { id: "p0-lld",       label: "LLD",                   crumb: "Practice / Low-Level Design",          group: "practice" },
  { id: "p0-sql",       label: "SQL · 30",              crumb: "Practice / SQL",                       group: "practice" },
];

const DEFAULT_VIEW = "sre-fnd";

const VIEW_MAP = {
  "overview":     OverviewView,
  "p0-sd":        P0_SysDesignView,
  "p0-behavior":  P0_BehaviorView,
  "p0-lld":       P0_LLDView,
  "p0-sql":       P0_SQLView,
  "p0-dsa":       P0_DSAView,
  "sre-fnd":      SRE_FoundationsView,
  "sre-cod":      SRE_CodingView,
  "sre-cloud":    SRE_CloudView,
  "sre-auto":     SRE_AutomationView,
  "sre-rel":      SRE_ReliabilityView,
  "sre-varnish":  SRE_VarnishView,
  "part-ai":      PartAIView,
  "part-b":       PartBView,
  "part-e":       PartEView,
  "part-g":       PartGView,
  "part-h":       PartHView,
  "part-i":       PartIView,
  "part-j":       PartJView,
};

function renderCrumb(crumb) {
  if (!crumb) return null;
  const parts = crumb.split(" / ");
  if (parts.length === 1) return <span className="leaf">{parts[0]}</span>;
  const head = parts.slice(0, -1).join(" / ");
  const leaf = parts[parts.length - 1];
  return <>{head}&nbsp;&nbsp;/&nbsp;&nbsp;<span className="leaf">{leaf}</span></>;
}

function ThemeToggle() {
  const [theme, setTheme] = useState(() =>
    document.documentElement.dataset.theme === "dark" ? "dark" : "light"
  );
  const flip = () => {
    const next = theme === "dark" ? "light" : "dark";
    if (next === "dark") document.documentElement.dataset.theme = "dark";
    else delete document.documentElement.dataset.theme;
    try { localStorage.setItem("sre:theme", next); } catch (e) {}
    setTheme(next);
  };
  return <button onClick={flip} title="Toggle dark / light mode">{theme === "dark" ? "light mode" : "dark mode"}</button>;
}

function App() {
  const [view, setView] = useState(() => (location.hash.replace("#", "") || DEFAULT_VIEW));
  useEffect(() => {
    const onHash = () => setView(location.hash.replace("#", "") || DEFAULT_VIEW);
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  const go = (id) => {
    location.hash = id;
    window.scrollTo(0, 0);
  };

  const all = useAllProgress();
  const vg = viewGroups();
  const sidebarPct = (id) => {
    const groups = vg[id];
    if (!groups || groups.length === 0) return null;
    let d = 0, t = 0;
    groups.forEach(g => { d += all.groups[g]?.done || 0; t += all.groups[g]?.total || 0; });
    if (t === 0) return null;
    return Math.round(d / t * 100);
  };

  const current = NAV.find(n => n.id === view);
  const Current = VIEW_MAP[view] || OverviewView;

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="brand">SRE Notebook<span className="dot">.</span></div>

        <div className="search" title="Search not wired yet">
          <span className="kbd-hint">⌘K</span> search…
        </div>

        <nav className="nav">
          {NAV.map(n => {
            if (n.group === "section") {
              return <div key={n.id} className="nav-group-label">{n.label}</div>;
            }
            const pct = sidebarPct(n.id);
            return (
              <button key={n.id}
                className={"nav-item " + (view === n.id ? "active" : "")}
                onClick={() => go(n.id)}
              >
                <span>{n.label}</span>
                {pct !== null && <span className="mini-bar">{pct}%</span>}
              </button>
            );
          })}
        </nav>

        <div className="sidebar-foot">
          Saved in your browser ·
          <button onClick={() => {
            if (confirm("Export all progress to clipboard as JSON?")) {
              const dump = {};
              for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && k.startsWith("sre:")) dump[k] = localStorage.getItem(k);
              }
              navigator.clipboard.writeText(JSON.stringify(dump, null, 2));
              alert("Copied to clipboard!");
            }
          }}>export</button>
          {' · '}
          <ThemeToggle />
        </div>
      </aside>

      <main className="main">
        {current?.crumb && <div className="crumb">{renderCrumb(current.crumb)}</div>}
        <Current />
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
