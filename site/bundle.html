<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRE Notebook — APAC Study Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Source+Serif+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ───────── Paper notebook aesthetic ───────── */

:root {
  --paper: #f6f1e4;
  --paper-2: #fbf6e7;
  --paper-line: #d8cdb1;
  --ink: #2a2418;
  --ink-soft: #5a4f3d;
  --ink-faint: #9a8e76;
  --red: #c4502e;
  --blue: #2a5d8f;
  --green: #4a7a3b;
  --yellow: #e6b820;
  --pink: #d68b9a;
  --accent: #f2c14e;
  --shadow: 0 1px 0 rgba(0,0,0,0.05), 0 8px 24px rgba(60, 45, 20, 0.08);
}

@font-face { font-family: 'Caveat'; src: local('Caveat'); }

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: 'Source Serif Pro', 'Iowan Old Style', Georgia, serif;
  color: var(--ink);
  background: var(--paper);
  background-image:
    radial-gradient(circle at 12% 18%, rgba(196,80,46,0.04), transparent 30%),
    radial-gradient(circle at 88% 78%, rgba(42,93,143,0.05), transparent 30%);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--blue); text-decoration: none; border-bottom: 1px dotted var(--blue); }
a:hover { color: var(--red); border-color: var(--red); }

button {
  font: inherit;
  cursor: pointer;
  background: none;
  border: none;
  color: inherit;
}

/* ───────── App shell ───────── */

.app {
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: 100vh;
}

/* ───────── Sidebar ───────── */

.sidebar {
  background:
    repeating-linear-gradient(transparent, transparent 27px, rgba(196,80,46,0.06) 28px),
    var(--paper-2);
  border-right: 1px dashed var(--paper-line);
  padding: 22px 18px 40px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--paper-line); border-radius: 3px; }

.brand {
  font-family: 'Caveat', 'Kalam', 'Patrick Hand', cursive;
  font-size: 32px;
  line-height: 1;
  margin: 4px 0 2px;
  color: var(--ink);
  letter-spacing: 0.5px;
}
.brand .dot { color: var(--red); }

.brand-sub {
  font-family: 'Caveat', cursive;
  font-size: 16px;
  color: var(--ink-soft);
  margin-bottom: 16px;
}

.overall-card {
  background: var(--paper);
  border: 1.5px solid var(--ink);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 20px;
  box-shadow: 3px 3px 0 var(--ink-soft);
  position: relative;
}

.overall-card h4 {
  margin: 0 0 6px;
  font-family: 'Caveat', cursive;
  font-size: 18px;
  font-weight: 600;
}

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-group-label {
  font-family: 'Caveat', cursive;
  font-size: 14px;
  color: var(--ink-faint);
  text-transform: uppercase;
  letter-spacing: 1.2px;
  margin: 14px 6px 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  border-radius: 8px;
  text-align: left;
  font-size: 14px;
  color: var(--ink-soft);
  border: 1.5px solid transparent;
  position: relative;
  transition: all 0.12s;
}
.nav-item:hover { background: rgba(196,80,46,0.06); color: var(--ink); }
.nav-item.active {
  background: var(--paper);
  border-color: var(--ink);
  color: var(--ink);
  box-shadow: 2px 2px 0 var(--ink-soft);
  font-weight: 600;
}
.nav-item .icon { font-size: 16px; width: 18px; text-align: center; }
.nav-item .mini-bar {
  position: absolute;
  right: 10px;
  font-size: 11px;
  color: var(--ink-faint);
  font-family: 'Caveat', cursive;
  font-size: 14px;
}

/* ───────── Main content ───────── */

.main {
  padding: 32px 40px 80px;
  max-width: 1100px;
}

.page-head {
  margin-bottom: 28px;
  padding-bottom: 14px;
  border-bottom: 2px dashed var(--paper-line);
}

.page-title {
  font-family: 'Caveat', cursive;
  font-size: 44px;
  font-weight: 700;
  line-height: 1;
  margin: 0 0 6px;
  color: var(--ink);
}
.page-sub { color: var(--ink-soft); font-size: 14px; margin: 0; }

.section-card {
  background: var(--paper-2);
  border: 1.5px solid var(--ink);
  border-radius: 14px;
  padding: 22px 26px;
  margin-bottom: 24px;
  box-shadow: 4px 4px 0 var(--ink-soft);
  position: relative;
}

.section-card.tilted-l { transform: rotate(-0.25deg); }
.section-card.tilted-r { transform: rotate(0.25deg); }

.section-card h2 {
  font-family: 'Caveat', cursive;
  font-size: 30px;
  font-weight: 700;
  margin: 0 0 4px;
  line-height: 1;
}
.section-card h3 {
  font-family: 'Caveat', cursive;
  font-size: 22px;
  font-weight: 700;
  margin: 18px 0 8px;
}
.section-card .lead { color: var(--ink-soft); margin: 0 0 14px; }

/* ───────── Progress bar ───────── */

.progress {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 8px 0 16px;
}
.progress-track {
  flex: 1;
  height: 14px;
  background: var(--paper);
  border: 1.5px solid var(--ink);
  border-radius: 8px;
  overflow: hidden;
  position: relative;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  background-image: repeating-linear-gradient(
    45deg, transparent, transparent 6px,
    rgba(0,0,0,0.06) 6px, rgba(0,0,0,0.06) 12px
  );
  transition: width 0.4s ease;
}
.progress-pct {
  font-family: 'Caveat', cursive;
  font-size: 22px;
  font-weight: 700;
  min-width: 60px;
  color: var(--ink);
}
.progress-frac {
  color: var(--ink-faint);
  font-size: 13px;
}

/* ───────── Checklist ───────── */

.checklist { list-style: none; padding: 0; margin: 0; }
.checklist li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 7px 8px;
  border-bottom: 1px dotted var(--paper-line);
  transition: background 0.1s;
}
.checklist li:hover { background: rgba(0,0,0,0.02); }
.checklist li:last-child { border-bottom: none; }

.check {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  border: 2px solid var(--ink);
  border-radius: 6px;
  cursor: pointer;
  background: var(--paper);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Caveat', cursive;
  font-size: 22px;
  color: var(--red);
  line-height: 1;
  transition: all 0.1s;
}
.check:hover { background: #fff; transform: scale(1.05) rotate(-2deg); }
.check.checked { background: #fff7d6; }

.item-label {
  flex: 1;
  cursor: pointer;
  padding-top: 1px;
}
.item-label.done {
  text-decoration: line-through;
  text-decoration-color: var(--red);
  text-decoration-thickness: 2px;
  color: var(--ink-faint);
}

.tag {
  display: inline-block;
  padding: 1px 8px;
  font-size: 11px;
  font-weight: 600;
  border-radius: 10px;
  border: 1.5px solid;
  margin-left: 6px;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  white-space: nowrap;
  font-family: 'Source Serif Pro', serif;
}
.tag-easy { color: var(--green); border-color: var(--green); }
.tag-medium { color: var(--yellow); border-color: var(--yellow); background: #fef9e0; }
.tag-hard { color: var(--red); border-color: var(--red); background: #fcebe2; }
.tag-num {
  display: inline-block;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  color: var(--ink-faint);
  margin-right: 8px;
  min-width: 36px;
}

/* ───────── DSA grid ───────── */

.dsa-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 16px;
}
@media (max-width: 900px) { .dsa-grid { grid-template-columns: 1fr; } }

/* ───────── Stat row (overview) ───────── */

.stat-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 22px;
}
@media (max-width: 900px) { .stat-row { grid-template-columns: 1fr 1fr; } }

.stat {
  background: var(--paper-2);
  border: 1.5px solid var(--ink);
  border-radius: 12px;
  padding: 14px 16px;
  box-shadow: 3px 3px 0 var(--ink-soft);
  position: relative;
  overflow: hidden;
}
.stat .v {
  font-family: 'Caveat', cursive;
  font-size: 42px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 2px;
}
.stat .l { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 1px; }
.stat .sub { font-size: 12px; color: var(--ink-faint); margin-top: 2px; font-family: 'Caveat', cursive; font-size: 16px; }

.stat.streak .v { color: var(--red); }
.stat.streak::after {
  content: "🔥";
  position: absolute;
  right: 10px;
  top: 8px;
  font-size: 22px;
  opacity: 0.7;
}

/* ───────── Habits ───────── */

.habit-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 0;
  border-bottom: 1px dotted var(--paper-line);
}
.habit-row:last-child { border: none; }
.habit-name {
  font-family: 'Caveat', cursive;
  font-size: 20px;
  flex: 1;
}
.habit-counter {
  display: flex;
  align-items: center;
  gap: 6px;
}
.habit-counter button {
  width: 28px;
  height: 28px;
  border: 1.5px solid var(--ink);
  border-radius: 6px;
  background: var(--paper);
  font-weight: 700;
  font-size: 16px;
  line-height: 1;
}
.habit-counter button:hover { background: #fff7d6; }
.habit-counter .num {
  font-family: 'Caveat', cursive;
  font-size: 22px;
  font-weight: 700;
  min-width: 60px;
  text-align: center;
}
.habit-counter .target { color: var(--ink-faint); }

.week-strip {
  display: flex;
  gap: 4px;
  margin-left: 12px;
}
.week-day {
  width: 22px;
  height: 22px;
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  background: var(--paper);
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Caveat', cursive;
  cursor: pointer;
}
.week-day.done { background: var(--accent); }
.week-day.today { box-shadow: 0 0 0 2px var(--red); }

/* ───────── Time log ───────── */

.time-log {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--ink-faint);
  margin-left: 8px;
}
.time-log input {
  width: 50px;
  padding: 1px 4px;
  border: 1px solid var(--paper-line);
  border-radius: 4px;
  background: var(--paper);
  font: inherit;
  text-align: right;
  color: var(--ink);
}

/* ───────── Notes ───────── */

.notes {
  width: 100%;
  margin-top: 10px;
  padding: 10px 12px;
  background:
    repeating-linear-gradient(transparent, transparent 22px, rgba(42,93,143,0.18) 23px),
    var(--paper);
  border: 1px dashed var(--paper-line);
  border-radius: 6px;
  font-family: 'Caveat', cursive;
  font-size: 18px;
  line-height: 24px;
  color: var(--ink);
  resize: vertical;
  min-height: 72px;
  outline: none;
}
.notes:focus { border-color: var(--blue); border-style: solid; }

/* ───────── Country tabs ───────── */

.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.tab {
  padding: 6px 14px;
  border: 1.5px solid var(--ink);
  border-radius: 20px;
  background: var(--paper);
  font-family: 'Caveat', cursive;
  font-size: 18px;
  font-weight: 600;
}
.tab.active { background: var(--accent); box-shadow: 2px 2px 0 var(--ink-soft); }

.job-row {
  display: grid;
  grid-template-columns: 22px 1fr 110px 90px;
  gap: 8px;
  align-items: center;
  padding: 6px 6px;
  border-bottom: 1px dotted var(--paper-line);
}
.job-row select {
  font: inherit;
  font-family: 'Caveat', cursive;
  font-size: 16px;
  padding: 2px 6px;
  border: 1.5px solid var(--paper-line);
  border-radius: 6px;
  background: var(--paper);
  color: var(--ink);
}

/* ───────── Doodles / accents ───────── */

.tape {
  position: absolute;
  background: rgba(255,235,150,0.7);
  width: 70px;
  height: 18px;
  top: -8px;
  border: 1px solid rgba(0,0,0,0.06);
  box-shadow: 1px 2px 4px rgba(0,0,0,0.06);
}
.tape.tl { left: 20px; transform: rotate(-3deg); }
.tape.tr { right: 20px; transform: rotate(2deg); }

.pin {
  display: inline-block;
  width: 14px; height: 14px;
  background: var(--red);
  border-radius: 50%;
  box-shadow: inset -2px -2px 4px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
  margin-right: 8px;
  vertical-align: middle;
}

.legend {
  font-family: 'Caveat', cursive;
  font-size: 18px;
  color: var(--ink-soft);
  margin-bottom: 10px;
}

.row-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 900px) { .row-grid-2 { grid-template-columns: 1fr; } }

.callout {
  border-left: 4px solid var(--red);
  padding: 8px 12px;
  background: rgba(196,80,46,0.06);
  border-radius: 4px;
  margin: 12px 0;
  font-style: italic;
  color: var(--ink-soft);
}

.kbd {
  font-family: 'Courier New', monospace;
  font-size: 12px;
  background: var(--paper);
  border: 1px solid var(--paper-line);
  border-radius: 4px;
  padding: 0 5px;
}

/* mobile */
@media (max-width: 800px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: relative; height: auto; border-right: none; border-bottom: 1px dashed var(--paper-line); }
  .main { padding: 24px 18px 60px; }
}

</style>
</head>

<script type="text/babel">
// Shared components + hooks for the SRE dashboard.
// Storage helpers: each item lives under "sre:" + id.

const { useState, useEffect, useMemo, useRef, useCallback } = React;

const STORAGE_PREFIX = "sre:";

function loadJSON(key, fallback) {
  try {
    const v = localStorage.getItem(STORAGE_PREFIX + key);
    if (v === null) return fallback;
    return JSON.parse(v);
  } catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value)); }
  catch (e) {}
}

// Hook: localStorage-backed state
function useStored(key, fallback) {
  const [v, setV] = useState(() => loadJSON(key, fallback));
  useEffect(() => { saveJSON(key, v); }, [key, v]);
  return [v, setV];
}

// Global "done" set across all items — one key per group, with cross-instance
// sync so multiple <Checklist> components sharing the same group stay in step.
// (Previously a write from instance B could clobber instance A's recent toggle
// because B's React state was stale relative to localStorage.)
function useDoneSet(group) {
  const key = "done:" + group;
  const [set, setSet] = useState(() => loadJSON(key, {}));

  // Listen for activity events from sibling instances of the same group and
  // re-read from localStorage so all instances see the latest state.
  useEffect(() => {
    const sync = (e) => {
      if (e && e.detail && e.detail.group === group) {
        setSet(loadJSON(key, {}));
      }
    };
    window.addEventListener("sre:activity", sync);
    return () => window.removeEventListener("sre:activity", sync);
  }, [group, key]);

  const toggle = useCallback((id) => {
    setSet(prev => {
      const next = { ...prev };
      if (next[id]) delete next[id]; else next[id] = Date.now();
      // Persist synchronously so other instances see fresh data when the
      // activity event fires.
      saveJSON(key, next);
      // Defer the event to a microtask so React has finished the commit
      // before siblings re-read state.
      Promise.resolve().then(() => {
        window.dispatchEvent(new CustomEvent("sre:activity", { detail: { id, group, done: !!next[id] } }));
      });
      return next;
    });
  }, [key, group]);

  return [set, toggle];
}

// ───────── Progress bar ─────────
function Progress({ done, total, label }) {
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  return (
    <div className="progress">
      <div className="progress-pct">{pct}%</div>
      <div className="progress-track">
        <div className="progress-fill" style={{ width: pct + "%" }}></div>
      </div>
      <div className="progress-frac">{done} / {total}{label ? " " + label : ""}</div>
    </div>
  );
}

// ───────── Tag (difficulty etc) ─────────
function Tag({ level }) {
  if (!level) return null;
  const cls = "tag tag-" + level.toLowerCase();
  return <span className={cls}>{level}</span>;
}

// ───────── Checklist ─────────
function Checklist({ items, group, renderItem }) {
  const [done, toggle] = useDoneSet(group);
  return (
    <ul className="checklist">
      {items.map(it => {
        const isDone = !!done[it.id];
        return (
          <li key={it.id}>
            <div
              className={"check " + (isDone ? "checked" : "")}
              onClick={() => toggle(it.id)}
              role="checkbox"
              aria-checked={isDone}
            >
              {isDone ? "✓" : ""}
            </div>
            <div
              className={"item-label " + (isDone ? "done" : "")}
              onClick={() => toggle(it.id)}
            >
              {renderItem ? renderItem(it, isDone) : it.name}
            </div>
          </li>
        );
      })}
    </ul>
  );
}

// ───────── Section card with auto progress ─────────
function SectionCard({ title, lead, items, group, renderItem, tilted, children }) {
  const [done] = useDoneSet(group);
  const completed = items ? items.filter(it => done[it.id]).length : 0;
  const total = items ? items.length : 0;
  const tiltClass = tilted === "left" ? "tilted-l" : tilted === "right" ? "tilted-r" : "";
  return (
    <section className={"section-card " + tiltClass}>
      {title && <h2>{title}</h2>}
      {lead && <p className="lead">{lead}</p>}
      {items && <Progress done={completed} total={total} />}
      {items && <Checklist items={items} group={group} renderItem={renderItem} />}
      {children}
    </section>
  );
}

// ───────── Notes (per section, persists) ─────────
function Notes({ id, placeholder }) {
  const [v, setV] = useStored("notes:" + id, "");
  return (
    <textarea
      className="notes"
      value={v}
      onChange={(e) => setV(e.target.value)}
      placeholder={placeholder || "Scribble notes, gotchas, links…"}
    />
  );
}

// ───────── Time log (hours per group) ─────────
function TimeLog({ id }) {
  const [hours, setHours] = useStored("time:" + id, 0);
  return (
    <span className="time-log">
      ⏱
      <input
        type="number"
        min="0"
        step="0.5"
        value={hours}
        onChange={(e) => setHours(parseFloat(e.target.value) || 0)}
      /> hrs logged
    </span>
  );
}

// ───────── Streak engine ─────────
// Tracks days with any activity. Streak = consecutive days ending today (or yesterday).
function todayKey(d = new Date()) {
  return d.toISOString().slice(0, 10);
}
function useStreak() {
  const [days, setDays] = useStored("activity-days", {}); // {YYYY-MM-DD: true}
  useEffect(() => {
    function onAct() {
      const k = todayKey();
      setDays(prev => prev[k] ? prev : { ...prev, [k]: true });
    }
    window.addEventListener("sre:activity", onAct);
    return () => window.removeEventListener("sre:activity", onAct);
  }, [setDays]);

  const { streak, longest } = useMemo(() => {
    const ks = Object.keys(days).sort();
    if (ks.length === 0) return { streak: 0, longest: 0 };
    const set = new Set(ks);
    // current streak
    let s = 0;
    let cursor = new Date();
    if (!set.has(todayKey(cursor))) cursor.setDate(cursor.getDate() - 1);
    while (set.has(todayKey(cursor))) {
      s++;
      cursor.setDate(cursor.getDate() - 1);
    }
    // longest streak
    let best = 0, run = 1;
    for (let i = 1; i < ks.length; i++) {
      const prev = new Date(ks[i-1]);
      prev.setDate(prev.getDate() + 1);
      if (todayKey(prev) === ks[i]) { run++; } else { best = Math.max(best, run); run = 1; }
    }
    best = Math.max(best, run);
    return { streak: s, longest: best };
  }, [days]);

  return { days, streak, longest };
}

// ───────── Habit counters ─────────
// Per week (ISO week, simple Sunday-start) — bumps per habit per day.
function weekKey(d = new Date()) {
  const dt = new Date(d);
  dt.setHours(0,0,0,0);
  const day = dt.getDay();
  dt.setDate(dt.getDate() - day); // Sunday
  return dt.toISOString().slice(0,10);
}
function useHabits() {
  const wk = weekKey();
  const [counts, setCounts] = useStored("habits:" + wk, {});
  // also keep daily marks for the strip
  const [daily, setDaily] = useStored("habit-daily:" + wk, {}); // {habitId: {0..6: count}}
  const dayIdx = new Date().getDay();

  const bump = (id, delta) => {
    setCounts(prev => {
      const cur = (prev[id] || 0) + delta;
      const next = { ...prev, [id]: Math.max(0, cur) };
      return next;
    });
    setDaily(prev => {
      const cur = prev[id] || {};
      const v = (cur[dayIdx] || 0) + delta;
      return { ...prev, [id]: { ...cur, [dayIdx]: Math.max(0, v) } };
    });
    // count toward streak
    if (delta > 0) {
      window.dispatchEvent(new CustomEvent("sre:activity", { detail: { id, group: "habit" } }));
    }
  };

  const reset = () => { setCounts({}); setDaily({}); };

  return { counts, daily, dayIdx, bump, reset, wk };
}

// ───────── Compute aggregate progress across all groups ─────────
function useAllProgress() {
  // collect all item ids by group from SRE_DATA
  const groups = useMemo(() => buildGroupIndex(SRE_DATA), []);
  // re-read on storage events
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const onStorage = () => setTick(t => t + 1);
    const onAct = () => setTick(t => t + 1);
    window.addEventListener("storage", onStorage);
    window.addEventListener("sre:activity", onAct);
    return () => {
      window.removeEventListener("storage", onStorage);
      window.removeEventListener("sre:activity", onAct);
    };
  }, []);
  const summary = useMemo(() => {
    const out = {};
    let allDone = 0, allTotal = 0;
    for (const [g, ids] of Object.entries(groups)) {
      const done = loadJSON("done:" + g, {});
      const d = ids.filter(id => done[id]).length;
      out[g] = { done: d, total: ids.length };
      allDone += d;
      allTotal += ids.length;
    }
    return { groups: out, total: allTotal, done: allDone };
  }, [groups, tick]);
  return summary;
}

// Map each group → array of item ids (for aggregate stats)
function buildGroupIndex(D) {
  const g = {};
  g.sdConcepts = D.sysDesignConcepts.map(i => i.id);
  g.sdDeep = D.sysDesignDeepDives.map(i => i.id);
  g.sdWalk = D.sysDesignWalkthroughs.map(i => i.id);
  g.star = D.starStories.map(i => i.id);
  g.lldV = D.lldVideos.map(i => i.id);
  g.lldP = D.lldPractice.map(i => i.id);
  g.sqlC = D.sqlConcepts.map(i => i.id);
  g.sqlP = D.sqlProblems.map(i => i.id);
  g.dsa = D.dsaTopics.flatMap(t => t.items.map(i => i.id));
  g.schedule = D.schedule.map(i => i.id);
  g.lifecycle = D.lifecycle.flatMap(t => t.items.map(i => i.id));
  g.phase = D.phases.flatMap(p => p.tasks.map(i => i.id));
  g.sreBooks = D.sreSysDesignBooks.map(i => i.id);
  g.sreTopics = D.sreSysDesignTopics.map(i => i.id);
  g.sreFlavor = D.sreFlavorQuestions.map(i => i.id);
  g.goPath = D.goPath.map(i => i.id);
  g.otherSk = D.otherSkills.map(i => i.id);
  g.loop = D.loopRounds.map(i => i.id);
  g.qAsk = D.questionsToAsk.map(i => i.id);
  g.repos = D.repos.map(i => i.id);
  g.blog = D.blogIdeas.map(i => i.id);
  g.certs = D.certs.map(i => i.id);
  g.books = D.books.map(i => i.id);
  g.courses = D.courses.map(i => i.id);
  // SRE Learning sections (each view has resources + milestones)
  if (D.sreRoadmap) {
    for (const [key, sec] of Object.entries(D.sreRoadmap)) {
      g["sreLr_" + key] = sec.resources.map(i => i.id);
      g["sreLm_" + key] = sec.milestones.map(i => i.id);
    }
  }
  return g;
}

// Combined per-view ids (used by the sidebar mini progress)
function viewGroups() {
  return {
    overview: [],
    "p0-sd": ["sdConcepts","sdDeep","sdWalk"],
    "p0-behavior": ["star"],
    "p0-lld": ["lldV","lldP"],
    "p0-sql": ["sqlC","sqlP"],
    "p0-dsa": ["dsa"],
    "p0-sched": ["schedule"],
    "sre-fnd":   ["sreLr_foundations",  "sreLm_foundations"],
    "sre-cod":   ["sreLr_coding",       "sreLm_coding"],
    "sre-cloud": ["sreLr_cloud",        "sreLm_cloud"],
    "sre-auto":  ["sreLr_automation",   "sreLm_automation"],
    "sre-rel":   ["sreLr_reliability",  "sreLm_reliability"],
    "part-a": ["lifecycle"],
    "part-b": ["phase"],
    "part-d": ["sreBooks","sreTopics","sreFlavor"],
    "part-e": ["goPath","otherSk"],
    "part-g": [], // tracked via job-status
    "part-h": ["loop","qAsk","star"],
    "part-i": ["repos","blog","certs"],
    "part-j": ["books","courses"],
    "habits": [],
  };
}

// expose globally
Object.assign(window, {
  loadJSON, saveJSON, useStored, useDoneSet,
  Progress, Tag, Checklist, SectionCard, Notes, TimeLog,
  useStreak, useHabits, useAllProgress, viewGroups, buildGroupIndex,
  todayKey, weekKey,
});

</script>

// ───────── PART G — APAC Jobs ─────────
function PartGView() {
  const countries = Object.keys(D.jobsByCountry);
  const [country, setCountry] = useStored("ui:job-country", countries[0]);
  const [jobs, setJobs] = useStored("jobs", {});
  const stages = ["Not yet", "Saved", "Applied", "Phone screen", "Interview", "Offer", "Rejected"];

  const setStage = (key, stage) => setJobs(prev => ({ ...prev, [key]: { ...(prev[key] || {}), stage } }));
  const toggleStar = (key) => setJobs(prev => ({ ...prev, [key]: { ...(prev[key] || {}), starred: !(prev[key]?.starred) } }));

  const counts = useMemo(() => {
    const out = { applied: 0, interview: 0, offer: 0 };
    Object.values(jobs).forEach(j => {
      const s = j.stage;
      if (s === "Applied" || s === "Phone screen" || s === "Interview") out.applied++;
      if (s === "Phone screen" || s === "Interview") out.interview++;
      if (s === "Offer") out.offer++;
    });
    return out;
  }, [jobs]);

  return (
    <div>
      <div className="page-head">
        <h1 className="page-title">Part G · APAC Job Search</h1>
        <p className="page-sub">Track each company through the pipeline. Star your top targets. Apply early, refer often.</p>
      </div>

      <div className="stat-row" style={{gridTemplateColumns: "repeat(3, 1fr)"}}>
        <div className="stat"><div className="v">{counts.applied}</div><div className="l">In pipeline</div></div>
        <div className="stat"><div className="v">{counts.interview}</div><div className="l">Interviewing</div></div>
        <div className="stat"><div className="v">{counts.offer}</div><div className="l">Offers</div></div>
      </div>

      <section className="section-card">
        <div className="tabs">
          {countries.map(c => (
            <button key={c} className={"tab " + (c === country ? "active" : "")} onClick={() => setCountry(c)}>{c}</button>
          ))}
        </div>
        <p className="legend">★ to mark a top target · drop-down sets stage</p>

        <div>
          {D.jobsByCountry[country].map(([name, url]) => {
            const key = country + ":" + name;
            const j = jobs[key] || {};
            return (
              <div key={key} className="job-row">
                <button title="Star" onClick={() => toggleStar(key)} style={{fontSize: 20, color: j.starred ? "var(--yellow)" : "var(--ink-faint)"}}>{j.starred ? "★" : "☆"}</button>
                <div><a href={url} target="_blank" rel="noopener">{name}</a></div>
                <select value={j.stage || "Not yet"} onChange={e => setStage(key, e.target.value)}>
                  {stages.map(s => <option key={s}>{s}</option>)}
                </select>
                <span style={{fontSize: 12, color: "var(--ink-faint)", fontFamily: "Caveat, cursive", fontSize: 16}}>{j.stage === "Offer" ? "🎉" : j.stage === "Rejected" ? "—" : ""}</span>
              </div>
            );
          })}
        </div>
      </section>
    </div>
  );
}

// ───────── HABITS ─────────
function HabitsView() {
  const { counts, daily, dayIdx, bump, reset, wk } = useHabits();
  const totalProgress = useMemo(() => {
    let hit = 0, tgt = 0;
    D.habits.forEach(h => {
      tgt += h.target;
      hit += Math.min(counts[h.id] || 0, h.target);
    });
    return { hit, tgt };
  }, [counts]);

  return (
    <div>
      <div className="page-head">
        <h1 className="page-title">Weekly Habits</h1>
        <p className="page-sub">Week starting <strong>{wk}</strong>. Bump each habit as you do it. Resets every Sunday.</p>
      </div>

      <section className="section-card tilted-l">
        <h2>This week</h2>
        <Progress done={totalProgress.hit} total={totalProgress.tgt} label="completions" />
        <button onClick={() => { if (confirm("Reset this week's counters?")) reset(); }}
          style={{padding:"4px 12px", border:"1.5px solid var(--paper-line)", borderRadius: 16, background: "var(--paper)", fontSize: 12, color: "var(--ink-soft)"}}>
          Reset week
        </button>

        <div style={{marginTop: 16}}>
          {D.habits.map(h => {
            const c = counts[h.id] || 0;
            const ratio = Math.min(1, c / h.target);
            const dailyMap = daily[h.id] || {};
            return (
              <div key={h.id} className="habit-row">
                <div className="habit-name">{h.name}</div>
                <div className="habit-counter">
                  <button onClick={() => bump(h.id, -1)}>−</button>
                  <span className="num">
                    {c}<span className="target"> / {h.target}</span>
                  </span>
                  <button onClick={() => bump(h.id, +1)}>+</button>
                </div>
                <div className="week-strip">
                  {["S","M","T","W","T","F","S"].map((l, i) => (
                    <div key={i} className={"week-day " + ((dailyMap[i]||0) > 0 ? "done " : "") + (i === dayIdx ? "today" : "")}>{l}</div>
                  ))}
                </div>
                <div style={{width: 30, fontFamily: "Caveat, cursive", fontSize: 22, color: ratio >= 1 ? "var(--green)" : "var(--ink-faint)"}}>
                  {ratio >= 1 ? "✓" : Math.round(ratio*100)+"%"}
                </div>
              </div>
            );
          })}
        </div>
      </section>

      <section className="section-card tilted-r">
        <h2>Why habits matter</h2>
        <p>15 hours/week is the budget. Spread it: 5 hrs LeetCode + 5 hrs technical study + 4 hrs hands-on + 1 hr writing/networking. The streak is the goal — daily input beats weekend cramming for skill-building.</p>
      </section>
    </div>
  );
}

function ResourceTag({ type }) {
  const map = {
    video:  { l: "VIDEO",  bg: "#fcebe2", c: "var(--red)" },
    course: { l: "COURSE", bg: "#dfeefb", c: "var(--blue)" },
    book:   { l: "BOOK",   bg: "#e3f1da", c: "var(--green)" },
    blog:   { l: "BLOG",   bg: "#fef9e0", c: "#9a6c00" },
  };
  const s = map[type] || { l: "RES", bg: "#eee", c: "#666" };
  return (
    <span
      className="tag"
      style={{ background: s.bg, color: s.c, borderColor: s.c, marginRight: 8, marginLeft: 0 }}
    >{s.l}</span>
  );
}

  const section = D.sreRoadmap[sectionKey];

  const renderResource = (it) => (
    <span>

      {it.url ? (
        <a href={it.url} target="_blank" rel="noopener">{it.name}</a>
      ) : <span>{it.name}</span>}

  return (

    return Math.round(d / t * 100);
  };

  const Current = VIEW_MAP[view] || OverviewView;

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="brand">SRE Notebook<span className="dot">.</span></div>

        <nav className="nav">
          {NAV.map(n => {
            if (n.group === "section") {
              return <div key={n.id} className="nav-group-label">— {n.label} —</div>;
            }
            const pct = sidebarPct(n.id);
            return (
              <button key={n.id}
                className={"nav-item " + (view === n.id ? "active" : "")}
                onClick={() => go(n.id)}
              >
                <span className="icon">{n.icon}</span>
                <span>{n.label}</span>
                {pct !== null && <span className="mini-bar">{pct}%</span>}
              </button>
            );
          })}
        </nav>

        <div style={{marginTop: 24, fontSize: 11, color: "var(--ink-faint)", textAlign: "center", fontFamily: "Caveat, cursive", fontSize: 14}}>
          Saved in your browser ·
          <button onClick={() => {
            if (confirm("Export all progress to clipboard as JSON?")) {
              const dump = {};
              for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && k.startsWith("sre:")) dump[k] = localStorage.getItem(k);
              }
              navigator.clipboard.writeText(JSON.stringify(dump, null, 2));
              alert("Copied to clipboard!");
            }
          }} style={{textDecoration: "underline", marginLeft: 4, color: "var(--blue)"}}>export</button>
        </div>
      </aside>

      <main className="main">
        <Current />
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
