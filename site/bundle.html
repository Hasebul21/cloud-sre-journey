<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRE Notebook — APAC Study Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Patrick+Hand&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ───────── Paper-notebook · V1 Reading aesthetic ───────── */

:root {
  /* wireframe palette */
  --paper:    #faf8f3;
  --paper-2:  #f3efe5;
  --ink:      #1a1714;
  --ink-2:    #5a534b;
  --ink-3:    #9a948c;
  --line:     #2a2622;
  --line-soft:#cfc8bb;
  --accent:        #c8552c;
  --accent-soft:   #fcebe2;
  --green:         #3b7a3f;
  --green-soft:    #dde9d6;
  --warn:          #a06b00;
  --warn-soft:     #fdf5d1;
  --course-fg:     #2b5c8a;
  --course-soft:   #e3edf6;
  --fill:    var(--paper-2);
  --fill-2:  var(--paper-2);

  /* fonts: handwritten for chrome/titles, sans for body, mono for meta */
  --hand-font:  'Kalam', 'Patrick Hand', cursive;
  --hand-tight: 'Patrick Hand', 'Kalam', cursive;
  --sans-font:  'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono-font:  'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* sketchy scribble rule used between sections */
  --scribble-rule: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 12'><path d='M0 6 Q 10 2, 20 6 T 40 6 T 60 6 T 80 6 T 100 6 T 120 6 T 140 6 T 160 6 T 180 6 T 200 6' fill='none' stroke='%231a1714' stroke-width='1.2'/></svg>");

  /* legacy var names some views still reference */
  --hand:        var(--accent);
  --blue:        var(--accent);
  --blue-soft:   var(--accent-soft);
  --red:         var(--accent);
  --yellow:      var(--warn);
  --ink-soft:    var(--ink-2);
  --ink-faint:   var(--ink-3);
  --paper-line:  var(--line-soft);
  --shadow:      none;

  --hover-tint: rgba(0,0,0,0.030);
  --tag-easy-fg: var(--green);
  --tag-easy-bg: var(--green-soft);
  --tag-easy-bd: var(--green);
  --tag-med-fg: var(--warn);
  --tag-med-bg: var(--warn-soft);
  --tag-med-bd: var(--warn);
  --tag-hard-fg: var(--accent);
  --tag-hard-bg: var(--accent-soft);
  --tag-hard-bd: var(--accent);
  --checked-fg: var(--paper);
}

:root[data-theme="dark"] {
  --paper:     #16130f;
  --paper-2:   #1d1a16;
  --ink:       #ece7df;
  --ink-2:     #b8b0a4;
  --ink-3:     #7d7569;
  --line:      #e3dfd6;
  --line-soft: #3a342d;
  --accent:        #e07a4e;
  --accent-soft:   #2e1a14;
  --green:         #8ab877;
  --green-soft:    #1f2a1c;
  --warn:          #d4a35a;
  --warn-soft:     #2a230e;
  --course-fg:     #8fb5da;
  --course-soft:   #1a2733;
  --fill:    var(--paper-2);
  --fill-2:  var(--paper-2);

  --scribble-rule: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 12'><path d='M0 6 Q 10 2, 20 6 T 40 6 T 60 6 T 80 6 T 100 6 T 120 6 T 140 6 T 160 6 T 180 6 T 200 6' fill='none' stroke='%23ece7df' stroke-width='1.2'/></svg>");

  --hover-tint: rgba(255,255,255,0.04);
  --tag-easy-fg: #b6df9e;
  --tag-easy-bg: #1c2e18;
  --tag-easy-bd: #2f5e0c;
  --tag-med-fg: #e6c97a;
  --tag-med-bg: #2a230e;
  --tag-med-bd: #5e4d18;
  --tag-hard-fg: #ff8a5b;
  --tag-hard-bg: #2e1a14;
  --tag-hard-bd: #5e2a1a;
  --checked-fg: #0d1117;

  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans-font);
  font-size: 14.5px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* faint paper grain — fixed so it doesn't move on scroll */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    radial-gradient(rgba(0,0,0,.025) 1px, transparent 1px),
    radial-gradient(rgba(0,0,0,.02) 1px, transparent 1px);
  background-size: 3px 3px, 7px 7px;
  background-position: 0 0, 1px 1px;
  mix-blend-mode: multiply;
}
:root[data-theme="dark"] body::before {
  background-image:
    radial-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    radial-gradient(rgba(255,255,255,.018) 1px, transparent 1px);
  mix-blend-mode: screen;
}

.app, .main, .sidebar { position: relative; z-index: 1; }

a { color: var(--blue); text-decoration: none; border-bottom: 1px solid transparent; }
a:hover { border-bottom-color: var(--blue); }

button {
  font: inherit;
  cursor: pointer;
  background: none;
  border: none;
  color: inherit;
  padding: 0;
}

/* ───────── App shell ───────── */

.app {
  display: grid;
  grid-template-columns: 256px 1fr;
  min-height: 100vh;
}

/* ───────── TOC sidebar ───────── */

.sidebar {
  background: var(--paper-2);
  border-right: 1px solid var(--line);
  padding: 0 0 24px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

.brand {
  font-family: var(--hand-font);
  font-weight: 700;
  font-size: 18px;
  padding: 18px 18px 14px;
  border-bottom: 1px solid var(--line);
  letter-spacing: -0.005em;
  color: var(--ink);
  transform: rotate(-0.5deg);
  display: inline-block;
}
.brand .dot { color: var(--accent); }

.search {
  margin: 14px 14px 6px;
  height: 30px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 8px;
  font-size: 11.5px;
  color: var(--ink-3);
}
.search .kbd-hint {
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-size: 10px;
  background: var(--fill-2);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 1px 5px;
  color: var(--ink-2);
}

.lc-daily {
  margin: 12px 14px 4px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  background: var(--paper);
  border: 1.4px solid var(--line);
  border-radius: 5px;
  color: var(--ink);
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.01em;
  text-decoration: none;
  transform: rotate(-0.3deg);
  transition: border-color 120ms ease, background 120ms ease, transform 80ms ease;
}
.lc-daily:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
  transform: rotate(-0.3deg) translateY(-1px);
}
.lc-daily:active { transform: rotate(-0.3deg) translateY(0); }
.lc-daily-badge {
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  background: #ffa116;
  color: #1a1a1a;
  border-radius: 3px;
  padding: 2px 5px;
  line-height: 1;
}
.lc-daily-label { flex: 1; color: var(--ink); }
.lc-daily-arrow {
  font-size: 12px;
  color: var(--ink-3);
}
.lc-daily:hover .lc-daily-arrow { color: var(--accent); }

.nav { padding: 6px 0 0; display: flex; flex-direction: column; }

.nav-group-label {
  font-family: var(--mono-font);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--ink-3);
  padding: 16px 18px 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 14px 5px 18px;
  font-size: 12.5px;
  line-height: 1.3;
  color: var(--ink-2);
  border-left: 2px solid transparent;
  width: 100%;
  text-align: left;
  transition: background .12s, color .12s;
}
.nav-item:hover { color: var(--ink); background: var(--hover-tint); }
.nav-item.active {
  background: var(--paper);
  color: var(--ink);
  font-weight: 600;
  border-left-color: var(--hand);
}
.nav-item .icon { display: none; }
.nav-item .mini-bar {
  margin-left: auto;
  font-size: 10px;
  color: var(--ink-3);
  font-weight: 600;
  font-family: var(--mono-font);
  min-width: 24px;
  text-align: right;
}
.nav-item.active .mini-bar { color: var(--accent); }

.sidebar-foot {
  margin-top: auto;
  padding: 18px 18px 0;
  font-size: 11px;
  color: var(--ink-3);
  border-top: 1px solid var(--line);
  line-height: 1.5;
}
.sidebar-foot button {
  color: var(--blue);
  text-decoration: underline;
  font-size: inherit;
  margin-left: 4px;
}

/* ───────── Main content ───────── */

.main {
  padding: 36px 56px 96px;
  width: 100%;
  max-width: none;
}

.crumb {
  font-size: 11px;
  color: var(--ink-3);
  margin-bottom: 8px;
  letter-spacing: 0.01em;
}
.crumb .leaf { color: var(--ink); }

.page-head {
  margin-bottom: 22px;
  padding-bottom: 0;
  border: none;
}
.page-title {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.15;
  margin: 0 0 6px;
  color: var(--ink);
}
.page-sub {
  color: var(--ink-2);
  font-size: 13.5px;
  margin: 0;
  max-width: 640px;
  line-height: 1.55;
}

/* ───────── Section block (was tilted card) ───────── */

.section-card {
  background: transparent;
  border: none;
  padding: 0;
  margin: 0 0 28px;
  box-shadow: none;
  transform: none !important;
  position: static;
}
.section-card.tilted-l,
.section-card.tilted-r { transform: none !important; }
.section-card h2 {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 17px;
  font-weight: 600;
  margin: 0 0 6px;
  letter-spacing: -0.01em;
  line-height: 1.25;
  color: var(--ink);
}
.section-card h3 {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 13.5px;
  font-weight: 600;
  margin: 18px 0 8px;
  letter-spacing: -0.005em;
  color: var(--ink);
}
.section-card .lead {
  color: var(--ink-2);
  margin: 0 0 14px;
  font-size: 13.5px;
  line-height: 1.55;
}

/* ───────── Overall progress card (sidebar) ───────── */

.overall-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 10px 12px;
  margin: 0 14px 12px;
  box-shadow: none;
}
.overall-card h4 {
  margin: 0 0 4px;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* ───────── Progress bar ───────── */

.progress {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 6px 0 14px;
}
.progress-track {
  flex: 1;
  max-width: 360px;
  height: 6px;
  background: var(--fill);
  border: none;
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--green);
  background-image: none;
  transition: width .4s ease;
}
.progress-pct {
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-size: 12px;
  font-weight: 600;
  min-width: 36px;
  color: var(--ink);
}
.progress-frac {
  color: var(--ink-3);
  font-size: 11px;
  font-weight: 500;
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
}

/* ───────── Checklist ───────── */

.checklist { list-style: none; padding: 0; margin: 0; }
.checklist li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px dotted var(--line-soft);
  font-family: var(--hand-font);
  font-size: 15.5px;
  line-height: 1.4;
  transition: background .1s;
}
.checklist li:hover { background: var(--hover-tint); }
.checklist li:last-child { border-bottom: none; }

.check {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  border: 1.6px solid var(--ink);
  border-radius: 3px 2px 3px 2px;
  cursor: pointer;
  background: var(--paper);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--hand-font);
  font-size: 13px;
  font-weight: 700;
  color: transparent;
  line-height: 1;
  transform: rotate(-1deg);
  transition: all .12s;
}
.check:hover { border-color: var(--accent); }
.check.checked {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--checked-fg);
}
.check.checked::after { content: "✓"; }
.check.checked > * { display: none; }

.item-label {
  flex: 1;
  cursor: pointer;
  padding-top: 0;
  color: var(--ink);
  font-family: var(--hand-font);
  font-size: 15.5px;
}
.item-label a { color: var(--ink); border-bottom-color: var(--ink-3); }
.item-label a:hover { color: var(--accent); border-bottom-color: var(--accent); }
.item-label.done {
  text-decoration: line-through;
  text-decoration-color: var(--ink-3);
  text-decoration-thickness: 1px;
  color: var(--ink-3);
}

/* ───────── Explore-now button (per checklist item) ───────── */
.explore-btn {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  border: 1px solid transparent;
  border-radius: 4px;
  background: transparent;
  color: var(--ink-3);
  font-size: 14px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0;
  transition: color 120ms, border-color 120ms, background 120ms, opacity 120ms;
}
.checklist li:hover .explore-btn,
.explore-btn:focus-visible { opacity: 1; }
.explore-btn:hover {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-soft);
}
.explore-btn.active {
  opacity: 1;
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-soft);
}

/* ───────── Currently-exploring sidebar panel ───────── */
.exploring-panel {
  margin: 10px 14px 4px;
  padding: 8px 10px 6px;
  background: var(--paper);
  border: 1px dashed var(--accent);
  border-radius: 5px;
}
.exploring-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--mono-font);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 4px;
}
.exploring-count {
  background: var(--accent);
  color: var(--paper);
  border-radius: 999px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.05em;
  padding: 1px 6px;
  min-width: 16px;
  text-align: center;
}
.exploring-panel ul { list-style: none; margin: 0; padding: 0; }
.exploring-li {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 3px 0;
}
.exploring-li + .exploring-li {
  border-top: 1px dotted var(--line-soft);
  padding-top: 5px;
  margin-top: 2px;
}
.exploring-row {
  display: flex;
  align-items: center;
  gap: 2px;
}
.exploring-item {
  flex: 1;
  text-align: left;
  font-family: var(--hand-font);
  font-size: 13.5px;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 2px 4px;
  border-radius: 3px;
  line-height: 1.3;
}
.exploring-item:hover:not(:disabled) {
  background: var(--accent-soft);
  color: var(--accent);
}
.exploring-item:disabled { cursor: default; color: var(--ink-3); }
.exploring-note-btn,
.exploring-x {
  width: 18px;
  height: 18px;
  font-size: 12px;
  line-height: 1;
  color: var(--ink-3);
  border-radius: 3px;
  flex-shrink: 0;
}
.exploring-note-btn:hover,
.exploring-x:hover {
  color: var(--accent);
  background: var(--accent-soft);
}
.exploring-note-btn.has-note { color: var(--accent); }
.exploring-x { font-size: 14px; }
.exploring-meta {
  font-family: var(--mono-font);
  font-size: 10px;
  color: var(--ink-3);
  padding: 0 4px;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.exploring-when { font-weight: 600; }
.exploring-note {
  font-family: var(--hand-font);
  font-size: 11.5px;
  color: var(--ink-2);
  margin-left: 4px;
}
.exploring-note-input {
  width: 100%;
  font: inherit;
  font-family: var(--hand-font);
  font-size: 12.5px;
  padding: 3px 6px;
  background: var(--paper);
  border: 1px solid var(--accent);
  border-radius: 3px;
  color: var(--ink);
  outline: none;
}

/* ───────── Tag pills ───────── */

.tag {
  display: inline-block;
  padding: 1px 7px;
  font-size: 9.5px;
  font-weight: 600;
  border-radius: 3px;
  border: 1px solid;
  margin-left: 6px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
  font-family: var(--mono-font);
}
.tag-easy { color: var(--tag-easy-fg); border-color: var(--tag-easy-bd); background: var(--tag-easy-bg); }
.tag-medium { color: var(--tag-med-fg); border-color: var(--tag-med-bd); background: var(--tag-med-bg); }
.tag-hard { color: var(--tag-hard-fg); border-color: var(--tag-hard-bd); background: var(--tag-hard-bg); }
.tag-num {
  display: inline-block;
  font-family: var(--mono-font);
  font-size: 11px;
  color: var(--ink-3);
  margin-right: 8px;
  min-width: 30px;
}

/* ───────── Wireframe htag — resource-type pills ───────── */
.htag {
  font-family: var(--mono-font);
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border: 1.2px solid var(--line);
  border-radius: 3px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-2);
  background: var(--paper-2);
  display: inline-block;
  white-space: nowrap;
  transform: rotate(-0.5deg);
  margin-right: 8px;
  flex-shrink: 0;
}
.htag-video    { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.htag-playlist { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.htag-book     { background: var(--green-soft);  color: var(--green);  border-color: var(--green);  }
.htag-course   { background: var(--course-soft); color: var(--course-fg); border-color: var(--course-fg); }
.htag-blog     { background: var(--warn-soft);   color: var(--warn);   border-color: var(--warn);   }
.htag-channel  { background: #f0e6ff; color: #6b3aa1; border-color: #6b3aa1; }
.htag-github   { background: #e8eaed; color: #1f2328; border-color: #1f2328; }
:root[data-theme="dark"] .htag-channel { background: #2a1d3a; color: #c9b1ee; border-color: #6b3aa1; }
:root[data-theme="dark"] .htag-github  { background: #2a2d31; color: #c8ccd1; border-color: #4a4e54; }

/* ───────── DSA grid ───────── */

.dsa-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 24px;
}
@media (max-width: 900px) { .dsa-grid { grid-template-columns: 1fr; } }

/* ───────── Stat row (overview) ───────── */

.stat-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 26px;
}
@media (max-width: 900px) { .stat-row { grid-template-columns: 1fr 1fr; } }

.stat {
  background: var(--paper);
  border: 1.2px solid var(--line);
  border-radius: 4px;
  padding: 14px;
  box-shadow: none;
  position: relative;
  overflow: hidden;
}
.stat .v {
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-size: 24px;
  font-weight: 500;
  line-height: 1;
  letter-spacing: -0.03em;
  margin-bottom: 6px;
  color: var(--ink);
}
.stat .v small {
  font-size: 12px;
  color: var(--ink-3);
  font-weight: 500;
}
.stat .l {
  font-size: 10px;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 600;
}
.stat .sub {
  font-size: 11px;
  color: var(--ink-3);
  margin-top: 4px;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
}
.stat.streak .v { color: var(--hand); }
.stat.streak::after { content: none; }

/* ───────── Habits ───────── */

.habit-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line-soft);
}
.habit-row:last-child { border: none; }
.habit-name {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 13.5px;
  font-weight: 500;
  flex: 1;
  color: var(--ink);
}
.habit-counter {
  display: flex;
  align-items: center;
  gap: 6px;
}
.habit-counter button {
  width: 24px;
  height: 24px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--paper);
  font-weight: 500;
  font-size: 13px;
  line-height: 1;
  color: var(--ink-2);
}
.habit-counter button:hover {
  background: var(--fill);
  border-color: var(--ink-2);
}
.habit-counter .num {
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-size: 14px;
  font-weight: 600;
  min-width: 50px;
  text-align: center;
  color: var(--ink);
}
.habit-counter .target { color: var(--ink-3); font-weight: 400; }

.week-strip { display: flex; gap: 3px; margin-left: 10px; }
.week-day {
  width: 18px;
  height: 18px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--paper);
  font-size: 9px;
  font-weight: 600;
  color: var(--ink-3);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
}
.week-day.done {
  background: var(--green);
  color: var(--checked-fg);
  border-color: var(--green);
}
.week-day.today { box-shadow: 0 0 0 1.5px var(--blue); }

/* ───────── Time log ───────── */

.time-log {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--ink-3);
  margin-left: 8px;
}
.time-log input {
  width: 44px;
  padding: 1px 4px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--paper);
  font: inherit;
  text-align: right;
  color: var(--ink);
}

/* ───────── Notes ───────── */

.notes {
  width: 100%;
  margin-top: 10px;
  padding: 10px 12px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 13px;
  line-height: 1.6;
  color: var(--ink);
  resize: vertical;
  min-height: 64px;
  outline: none;
}
.notes:focus { border-color: var(--blue); }

/* ───────── Country / generic tabs ───────── */

.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.tab {
  padding: 5px 12px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--paper);
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink-2);
  letter-spacing: 0.01em;
  box-shadow: none;
}
.tab:hover { border-color: var(--ink-2); }
.tab.active {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
  box-shadow: none;
}

.job-row {
  display: grid;
  grid-template-columns: 18px 1fr 110px 90px;
  gap: 10px;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--line-soft);
  font-size: 13px;
}
.job-row select {
  font: inherit;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 12px;
  padding: 3px 6px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--paper);
  color: var(--ink);
}

/* ───────── Doodles dropped ───────── */

.tape, .pin { display: none !important; }

.legend {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 11.5px;
  color: var(--ink-3);
  margin-bottom: 10px;
  letter-spacing: 0.01em;
}
.legend strong { color: var(--ink); }

.row-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
}
@media (max-width: 900px) { .row-grid-2 { grid-template-columns: 1fr; } }

.callout {
  border: 1.4px solid var(--line);
  border-left-width: 4px;
  border-left-color: var(--accent);
  padding: 12px 16px;
  background: var(--paper-2);
  border-radius: 5px;
  margin: 14px 0 22px;
  color: var(--ink-2);
  font-family: var(--hand-font);
  font-size: 15px;
  line-height: 1.5;
}

.kbd {
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-size: 11px;
  background: var(--fill-2);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 1px 5px;
  color: var(--ink-2);
}

/* ───────── Dashboard subsection layout ───────── */

/* ─── V1 Reading · stage head with right rail ─── */
.dash-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  margin: 4px 0 22px;
  padding-bottom: 0;
  border-bottom: none;
}
.dash-head > div:first-child { flex: 1; min-width: 0; }
.dash-eyebrow {
  font-family: var(--mono-font);
  font-size: 10.5px;
  color: var(--ink-3);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 600;
  margin-bottom: 6px;
}
.dash-title {
  margin: 0;
  font-family: var(--hand-font);
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--ink);
  line-height: 1.05;
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
.dash-num {
  font-family: var(--mono-font);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--accent);
}
.dash-slash {
  color: var(--ink-3);
  font-weight: 300;
  margin: 0 2px;
}
.dash-name { font-family: var(--hand-font); font-weight: 700; }
.dash-sub {
  font-family: var(--hand-font);
  font-size: 16px;
  color: var(--ink-2);
  max-width: 56ch;
  margin: 10px 0 0;
  line-height: 1.5;
}

/* right rail that replaces the 4 stat tiles */
.dash-rail {
  width: 230px;
  flex-shrink: 0;
  padding: 14px 14px 16px;
  border: 1.4px solid var(--line);
  border-radius: 6px;
  background: var(--paper-2);
  font-family: var(--mono-font);
  font-size: 11px;
  transform: rotate(0.35deg);
}
.dash-rail h4 {
  margin: 0 0 8px;
  font-family: var(--hand-font);
  font-weight: 700;
  font-size: 14px;
  color: var(--ink);
}
.dash-rail .row {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  padding: 5px 0;
  border-bottom: 1px dotted var(--line-soft);
  color: var(--ink-2);
}
.dash-rail .row:last-child { border-bottom: none; }
.dash-rail .row b {
  color: var(--ink);
  font-weight: 600;
}
.dash-rail .row b.accent { color: var(--accent); }

@media (max-width: 900px) {
  .dash-head { flex-direction: column; gap: 16px; }
  .dash-rail { width: 100%; transform: none; }
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--fill-2);
  border: 1px solid var(--line);
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-2);
  text-transform: lowercase;
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 4px;
}
.status-pill .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ink-3);
}
.status-pill.status-active { color: var(--hand); border-color: var(--blue-soft); background: var(--blue-soft); }
.status-pill.status-active .dot { background: var(--hand); }
.status-pill.status-done { color: var(--green); border-color: var(--green-soft); background: var(--green-soft); }
.status-pill.status-done .dot { background: var(--green); }

.stat-tiles {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 0 0 20px;
}
@media (max-width: 700px) { .stat-tiles { grid-template-columns: 1fr 1fr; } }
.stat-tile {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 11px 14px;
}
.stat-tile-label {
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--ink-3);
  margin-bottom: 5px;
}
.stat-tile-value {
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--ink);
}
.stat-tile-value.accent { color: var(--hand); }
.stat-tile-sub {
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-size: 11px;
  color: var(--ink-3);
  margin-top: 4px;
  font-weight: 500;
}

/* V1 Reading: typographic sections — no card chrome, separated by scribble rule */
.list-section {
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 0;
  margin: 0 0 26px;
}
.list-section + .list-section {
  padding-top: 18px;
  border-top: none;
  background-image: var(--scribble-rule);
  background-repeat: repeat-x;
  background-size: 80px 12px;
  background-position: top center;
}
.list-section-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 14px;
  margin-bottom: 4px;
}
.list-section-head h2 {
  margin: 0;
  font-family: var(--hand-font);
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -0.005em;
  text-transform: none;
  color: var(--ink);
}
.list-section-progress {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono-font);
  font-size: 11px;
  color: var(--ink-3);
  font-weight: 500;
  white-space: nowrap;
}
.list-section-progress .pct {
  color: var(--accent);
  font-weight: 600;
  font-size: 12px;
}
.list-section .lead {
  font-family: var(--hand-font);
  font-size: 15px;
  color: var(--ink-2);
  margin: 2px 0 10px;
  line-height: 1.45;
}

.playlist-group {
  margin: 14px 0 4px;
}
.playlist-group:first-of-type {
  margin-top: 10px;
}
.playlist-group + .playlist-group {
  border-top: 1px dashed var(--line);
  padding-top: 12px;
}
.playlist-group-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 6px;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
}
.playlist-group-title a {
  color: var(--ink);
  text-decoration: none;
  border-bottom: 1px dotted var(--ink-3);
}
.playlist-group-title a:hover {
  color: var(--hand);
  border-bottom-color: var(--hand);
}
.playlist-group-count {
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-3);
  margin-left: auto;
}

.sparkbar {
  display: inline-flex;
  align-items: flex-end;
  gap: 2px;
  height: 12px;
}
.sparkbar-tick {
  width: 2px;
  height: 6px;
  background: var(--line);
  border-radius: 1px;
  transition: background .12s, height .12s;
}
.sparkbar-tick:nth-child(3n)   { height: 8px; }
.sparkbar-tick:nth-child(4n+1) { height: 10px; }
.sparkbar-tick.on { background: var(--accent); }

.notes-section {
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 18px 0 0;
  margin: 0 0 4px;
  background-image: var(--scribble-rule);
  background-repeat: repeat-x;
  background-size: 80px 12px;
  background-position: top center;
}
.notes-section .list-section-head { margin-bottom: 8px; }
.notes-section .notes {
  font-family: var(--mono-font);
  font-size: 12.5px;
  background: var(--paper-2);
  border: 1.4px solid var(--line-soft);
  border-radius: 5px;
  padding: 12px 14px;
  min-height: 96px;
  line-height: 1.55;
  color: var(--ink-2);
}

/* ───────── AI Engineering · 4 level tiles + stacked level cards ───────── */

.level-tiles {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 0 0 20px;
}
@media (max-width: 700px) { .level-tiles { grid-template-columns: 1fr 1fr; } }
.level-tile {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 12px 14px 14px;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: border-color .12s, background .12s;
}
.level-tile:hover { border-color: var(--ink-3); background: var(--fill-2); border-bottom: 1px solid var(--ink-3); }
.level-tile-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
}
.level-tile-num {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
}
.level-tile-pct {
  font-size: 14px;
  font-weight: 600;
  color: var(--hand);
}
.level-tile-name {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 12px;
  color: var(--ink-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.level-card-v2 {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 18px 20px 14px;
  margin: 0 0 14px;
  scroll-margin-top: 18px;
}
.level-card-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  margin-bottom: 2px;
}
.level-card-title {
  display: flex;
  align-items: baseline;
  gap: 9px;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--ink);
}
.level-card-num {
  font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  font-weight: 500;
  letter-spacing: -0.03em;
}
.level-card-slash { color: var(--ink-3); font-weight: 300; }
.level-card-v2 > .lead {
  font-size: 13px;
  color: var(--ink-2);
  margin: 4px 0 14px;
  line-height: 1.55;
}
.level-card-v2 .list-section {
  background: transparent;
  border: none;
  padding: 8px 0 0;
  margin: 0;
}
.level-card-v2 .list-section + .list-section {
  border-top: 1px dashed var(--line);
  margin-top: 8px;
  padding-top: 10px;
}

/* ───────── Mental model view ───────── */

.mm-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}
.mm-head > div:first-child { flex: 1; min-width: 0; }

.daily-streak-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  border: 1.4px solid var(--line);
  border-radius: 5px;
  background: var(--paper-2);
  color: var(--ink);
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.01em;
  cursor: pointer;
  white-space: nowrap;
  transition: background 120ms ease, border-color 120ms ease, transform 80ms ease;
}
.daily-streak-btn:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.daily-streak-btn:active { transform: translateY(1px); }
.daily-streak-btn.ticked {
  border-color: var(--accent);
}
.daily-streak-label {
  color: var(--ink);
}
.daily-streak-count {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--accent);
  background: var(--paper);
  border: 1px solid var(--line-soft);
  border-radius: 3px;
  padding: 1px 6px;
}
.daily-streak-btn.ticked .daily-streak-count {
  background: var(--accent);
  color: var(--paper);
  border-color: var(--accent);
}

@media (max-width: 700px) {
  .mm-head { flex-direction: column; align-items: flex-start; gap: 10px; }
  .daily-streak-btn { align-self: flex-start; }
}

.mm-stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 8px 0 4px;
}
.mm-row {
  display: grid;
  grid-template-columns: 180px 1fr 220px;
  gap: 14px;
  align-items: center;
  width: 100%;
  max-width: 760px;
  padding: 12px 16px;
  border: 1.4px solid var(--line);
  border-radius: 6px;
  background: var(--paper-2);
}
.mm-row .mm-tier-name {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-weight: 600;
  font-size: 14px;
  color: var(--ink);
}
.mm-row .mm-tier-tech {
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.45;
}
.mm-row .mm-tier-where {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  color: var(--ink-soft);
  text-align: right;
}
.mm-row-edge    { border-left: 4px solid var(--accent); }
.mm-row-backend { border-left: 4px solid #2d7a4f; }
.mm-row-data    { border-left: 4px solid #b68421; }
.mm-row-neutral { border-left: 4px solid var(--line-soft); opacity: 0.85; }

.mm-arrow {
  font-size: 18px;
  color: var(--ink-soft);
  line-height: 1;
  margin: 2px 0;
  font-family: 'IBM Plex Mono', monospace;
}

.mm-cross {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin-top: 4px;
}
.mm-cross th, .mm-cross td {
  text-align: left;
  vertical-align: top;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line-soft);
}
.mm-cross th {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-soft);
  border-bottom: 1.4px solid var(--line);
}
.mm-cross td b { color: var(--ink); }

.mm-boundary {
  margin: 6px 0 8px;
  padding: 0 0 0 18px;
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--ink-2);
}
.mm-boundary li { margin: 6px 0; }
.mm-boundary b { color: var(--ink); }

@media (max-width: 700px) {
  .mm-row {
    grid-template-columns: 1fr;
    gap: 4px;
  }
  .mm-row .mm-tier-where { text-align: left; }
  .mm-cross { font-size: 12px; }
  .mm-cross th, .mm-cross td { padding: 6px 8px; }
}

/* ───────── Mobile ───────── */

@media (max-width: 800px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: relative;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--line);
  }
  .main {
    padding: 22px 18px 60px;
    max-width: 100%;
  }
  .page-title { font-size: 24px; }
}

/* Topic subsections within a resource list */
.res-subgroup + .res-subgroup { margin-top: 6px; }
.res-subgroup-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 22px 0 10px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-soft);
  border-bottom: 1px solid var(--line-soft);
  padding-bottom: 7px;
}
.res-subgroup:first-child .res-subgroup-head { margin-top: 4px; }
.res-subgroup-count {
  font-weight: 400;
  font-size: 11px;
  letter-spacing: 0;
  color: var(--ink-faint);
}

/* ───── Part K — HLD Roadmap view ───── */
.hld-stagemap {
  width: 100%;
  border-collapse: collapse;
  margin: 4px 0 8px;
  font-size: 13px;
}
.hld-stagemap th,
.hld-stagemap td {
  text-align: left;
  padding: 6px 10px;
  border-bottom: 1px dotted var(--ink-faint);
  vertical-align: top;
}
.hld-stagemap th {
  font-family: var(--hand-font);
  font-weight: 700;

<script type="text/babel">
// Shared components + hooks for the SRE dashboard.
// Storage helpers: each item lives under "sre:" + id.

const { useState, useEffect, useMemo, useRef, useCallback } = React;

const STORAGE_PREFIX = "sre:";

function loadJSON(key, fallback) {
  try {
    const v = localStorage.getItem(STORAGE_PREFIX + key);
    if (v === null) return fallback;
    return JSON.parse(v);
  } catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value)); }
  catch (e) {}
}

// Hook: localStorage-backed state
function useStored(key, fallback) {
  const [v, setV] = useState(() => loadJSON(key, fallback));
  useEffect(() => { saveJSON(key, v); }, [key, v]);
  return [v, setV];
}

// Global "done" set across all items — one key per group, with cross-instance
// sync so multiple <Checklist> components sharing the same group stay in step.
// (Previously a write from instance B could clobber instance A's recent toggle
// because B's React state was stale relative to localStorage.)
function useDoneSet(group) {
  const key = "done:" + group;
  const [set, setSet] = useState(() => loadJSON(key, {}));

  // Listen for activity events from sibling instances of the same group and
  // re-read from localStorage so all instances see the latest state.
  useEffect(() => {
    const sync = (e) => {
      if (e && e.detail && e.detail.group === group) {
        setSet(loadJSON(key, {}));
      }
    };
    window.addEventListener("sre:activity", sync);
    return () => window.removeEventListener("sre:activity", sync);
  }, [group, key]);

  const toggle = useCallback((id) => {
    setSet(prev => {
      const next = { ...prev };
      if (next[id]) delete next[id]; else next[id] = Date.now();
      // Persist synchronously so other instances see fresh data when the
      // activity event fires.
      saveJSON(key, next);
      // Defer the event to a microtask so React has finished the commit
      // before siblings re-read state.
      Promise.resolve().then(() => {
        window.dispatchEvent(new CustomEvent("sre:activity", { detail: { id, group, done: !!next[id] } }));
      });
      return next;
    });
  }, [key, group]);

  return [set, toggle];
}

// ───────── Currently-exploring set ─────────
// Items the user has flagged as "currently exploring". Map id → { name, group, at }.
// Auto-removes an entry when that item is marked done elsewhere.
function useExploring() {
  const KEY = "exploring";
  const [map, setMap] = useState(() => loadJSON(KEY, {}));

  useEffect(() => {
    const sync = () => setMap(loadJSON(KEY, {}));
    window.addEventListener("sre:exploring", sync);
    return () => window.removeEventListener("sre:exploring", sync);
  }, []);

  useEffect(() => {
    const onAct = (e) => {
      if (!e.detail || !e.detail.done) return;
      const cur = loadJSON(KEY, {});
      if (!cur[e.detail.id]) return;
      const next = { ...cur };
      delete next[e.detail.id];
      saveJSON(KEY, next);
      Promise.resolve().then(() => {
        window.dispatchEvent(new CustomEvent("sre:exploring"));
      });
    };
    window.addEventListener("sre:activity", onAct);
    return () => window.removeEventListener("sre:activity", onAct);
  }, []);

  const toggle = useCallback((id, payload) => {
    const cur = loadJSON(KEY, {});
    const next = { ...cur };
    if (next[id]) delete next[id];
    else next[id] = { ...payload, at: Date.now() };
    saveJSON(KEY, next);
    setMap(next);
    Promise.resolve().then(() => {
      window.dispatchEvent(new CustomEvent("sre:exploring"));
    });
  }, []);

  const remove = useCallback((id) => {
    const cur = loadJSON(KEY, {});
    if (!cur[id]) return;
    const next = { ...cur };
    delete next[id];
    saveJSON(KEY, next);
    setMap(next);
    Promise.resolve().then(() => {
      window.dispatchEvent(new CustomEvent("sre:exploring"));
    });
  }, []);

  // Bump the `at` timestamp for an item — call when the user re-engages so
  // the most-recently-touched one floats to the top of the exploring list.
  const touch = useCallback((id) => {
    const cur = loadJSON(KEY, {});
    if (!cur[id]) return;
    const next = { ...cur, [id]: { ...cur[id], at: Date.now() } };
    saveJSON(KEY, next);
    setMap(next);
    Promise.resolve().then(() => {
      window.dispatchEvent(new CustomEvent("sre:exploring"));
    });
  }, []);

  // Persist a one-line "where I left off" breadcrumb for an item.
  const setNote = useCallback((id, note) => {
    const cur = loadJSON(KEY, {});
    if (!cur[id]) return;
    const trimmed = (note || "").trim();
    const next = { ...cur, [id]: { ...cur[id], note: trimmed, at: Date.now() } };
    saveJSON(KEY, next);
    setMap(next);
    Promise.resolve().then(() => {
      window.dispatchEvent(new CustomEvent("sre:exploring"));
    });
  }, []);

  return { map, toggle, remove, touch, setNote };
}

// ───────── Progress bar ─────────
function Progress({ done, total, label }) {
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  return (
    <div className="progress">
      <div className="progress-pct">{pct}%</div>
      <div className="progress-track">
        <div className="progress-fill" style={{ width: pct + "%" }}></div>
      </div>
      <div className="progress-frac">{done} / {total}{label ? " " + label : ""}</div>
    </div>
  );
}

// ───────── Tag (difficulty etc) ─────────
function Tag({ level }) {
  if (!level) return null;
  const cls = "tag tag-" + level.toLowerCase();
  return <span className={cls}>{level}</span>;
}

// ───────── Checklist ─────────
function Checklist({ items, group, renderItem }) {
  const [done, toggle] = useDoneSet(group);
  const { map: exploring, toggle: toggleExploring } = useExploring();
  // Clicks that land on (or inside) a link should navigate, not toggle.
  const onLabelClick = (e, id) => {
    if (e.target.closest && e.target.closest("a")) return;
    toggle(id);
  };
  return (
    <ul className="checklist">
      {items.map(it => {
        const isDone = !!done[it.id];
        const isExp = !!exploring[it.id];
        return (
          <li key={it.id}>
            <div
              className={"check " + (isDone ? "checked" : "")}
              onClick={() => toggle(it.id)}
              role="checkbox"
              aria-checked={isDone}
            >
              {isDone ? "✓" : ""}
            </div>
            <div
              className={"item-label " + (isDone ? "done" : "")}
              onClick={(e) => onLabelClick(e, it.id)}
            >
              {renderItem ? renderItem(it, isDone) : it.name}
            </div>
            {!isDone && (
              <button
                type="button"
                className={"explore-btn " + (isExp ? "active" : "")}
                onClick={(e) => {
                  e.stopPropagation();
                  toggleExploring(it.id, { name: it.name, group });
                }}
                title={isExp ? "Stop tracking — remove from sidebar" : "Mark as currently exploring — show in sidebar"}
                aria-label={isExp ? "Stop exploring" : "Mark as exploring"}
                aria-pressed={isExp}
              >
                {isExp ? "★" : "☆"}
              </button>
            )}
          </li>
        );
      })}
    </ul>
  );
}

// ───────── Section card with auto progress ─────────
function SectionCard({ title, lead, items, group, renderItem, tilted, children }) {
  const [done] = useDoneSet(group);
  const completed = items ? items.filter(it => done[it.id]).length : 0;
  const total = items ? items.length : 0;
  const tiltClass = tilted === "left" ? "tilted-l" : tilted === "right" ? "tilted-r" : "";
  return (
    <section className={"section-card " + tiltClass}>
      {title && <h2>{title}</h2>}
      {lead && <p className="lead">{lead}</p>}
      {items && <Progress done={completed} total={total} />}
      {items && <Checklist items={items} group={group} renderItem={renderItem} />}
      {children}
    </section>
  );
}

// ───────── Notes (per section, persists) ─────────
function Notes({ id, placeholder }) {
  const [v, setV] = useStored("notes:" + id, "");
  return (
    <textarea
      className="notes"
      value={v}
      onChange={(e) => setV(e.target.value)}
      placeholder={placeholder || "Scribble notes, gotchas, links…"}
    />
  );
}

// ───────── Time log (hours per group) ─────────
function TimeLog({ id }) {
  const [hours, setHours] = useStored("time:" + id, 0);
  return (
    <span className="time-log">
      ⏱
      <input
        type="number"
        min="0"
        step="0.5"
        value={hours}
        onChange={(e) => setHours(parseFloat(e.target.value) || 0)}
      /> hrs logged
    </span>
  );
}

// ───────── Streak engine ─────────
// Tracks days with any activity. Streak = consecutive days ending today (or yesterday).
function todayKey(d = new Date()) {
  return d.toISOString().slice(0, 10);
}
function useStreak() {
  const [days, setDays] = useStored("activity-days", {}); // {YYYY-MM-DD: true}
  useEffect(() => {
    function onAct() {
      const k = todayKey();
      setDays(prev => prev[k] ? prev : { ...prev, [k]: true });
    }
    window.addEventListener("sre:activity", onAct);
    return () => window.removeEventListener("sre:activity", onAct);
  }, [setDays]);

  const { streak, longest } = useMemo(() => {
    const ks = Object.keys(days).sort();
    if (ks.length === 0) return { streak: 0, longest: 0 };
    const set = new Set(ks);
    // current streak
    let s = 0;
    let cursor = new Date();
    if (!set.has(todayKey(cursor))) cursor.setDate(cursor.getDate() - 1);
    while (set.has(todayKey(cursor))) {
      s++;
      cursor.setDate(cursor.getDate() - 1);
    }
    // longest streak
    let best = 0, run = 1;
    for (let i = 1; i < ks.length; i++) {
      const prev = new Date(ks[i-1]);
      prev.setDate(prev.getDate() + 1);
      if (todayKey(prev) === ks[i]) { run++; } else { best = Math.max(best, run); run = 1; }
    }
    best = Math.max(best, run);
    return { streak: s, longest: best };
  }, [days]);

  return { days, streak, longest };
}

// ───────── Compute aggregate progress across all groups ─────────
function useAllProgress() {
  // collect all item ids by group from SRE_DATA
  const groups = useMemo(() => buildGroupIndex(SRE_DATA), []);
  // re-read on storage events
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const onStorage = () => setTick(t => t + 1);
    const onAct = () => setTick(t => t + 1);
    window.addEventListener("storage", onStorage);
    window.addEventListener("sre:activity", onAct);
    return () => {
      window.removeEventListener("storage", onStorage);
      window.removeEventListener("sre:activity", onAct);
    };
  }, []);
  const summary = useMemo(() => {
    const out = {};
    let allDone = 0, allTotal = 0;
    for (const [g, ids] of Object.entries(groups)) {
      const done = loadJSON("done:" + g, {});
      const d = ids.filter(id => done[id]).length;
      out[g] = { done: d, total: ids.length };
      allDone += d;
      allTotal += ids.length;
    }
    return { groups: out, total: allTotal, done: allDone };
  }, [groups, tick]);
  return summary;
}

function PartGView() {

  const counts = useMemo(() => {
    const out = { applied: 0, interview: 0, offer: 0 };
    Object.values(jobs).forEach(j => {
      const s = j.stage;
      if (s === "Applied" || s === "Phone screen" || s === "Interview") out.applied++;
      if (s === "Phone screen" || s === "Interview") out.interview++;
      if (s === "Offer") out.offer++;
    });
    return out;

  return (
    <div>

      </div>

      <div className="stat-row" style={{gridTemplateColumns: "repeat(3, 1fr)"}}>

            const key = country + ":" + name;

              <div key={key} className="job-row">
                <button title="Star" onClick={() => toggleStar(key)} style={{fontSize: 20, color: j.starred ? "var(--yellow)" : "var(--ink-faint)"}}>{j.starred ? "★" : "☆"}</button>
                <div><a href={url} target="_blank" rel="noopener">{name}</a></div>
                <select value={j.stage || "Not yet"} onChange={e => setStage(key, e.target.value)}>
                  {stages.map(s => <option key={s}>{s}</option>)}
                </select>
                <span style={{fontSize: 14, color: "var(--ink-faint)"}}>{j.stage === "Offer" ? "🎉" : j.stage === "Rejected" ? "—" : ""}</span>

function ResourceTag({ type }) {
  const labels = {
    video: "VIDEO", course: "COURSE", book: "BOOK", blog: "BLOG",
    playlist: "PLAYLIST", channel: "CHANNEL", github: "GITHUB",
  };
  return (

function StatusPill({ pct }) {
  let label = "not started", cls = "neutral";
  if (pct >= 100) { label = "complete"; cls = "done"; }
  else if (pct > 0) { label = "in progress"; cls = "active"; }
  return (
    <span className={"status-pill status-" + cls}>
      <span className="dot" /> {label}
    </span>
  );
}

function StatTile({ label, value, sub, accent }) {
  return (
    <div className="stat-tile">
      <div className="stat-tile-label">{label}</div>
      <div className={"stat-tile-value" + (accent ? " accent" : "")}>{value}</div>
      {sub && <div className="stat-tile-sub">{sub}</div>}
    </div>
  );
}

function Sparkbar({ pct, bars = 14 }) {
  const filled = Math.round(bars * pct / 100);
  return (
    <span className="sparkbar">
      {Array.from({ length: bars }).map((_, i) => (
        <span key={i} className={"sparkbar-tick" + (i < filled ? " on" : "")} />
      ))}
    </span>
  );
}

function ListSection({ title, lead, done, total, children }) {
  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  return (
    <section className="list-section">
      <div className="list-section-head">
        <h2>{title}</h2>
        <div className="list-section-progress">
          <Sparkbar pct={pct} />
          <span className="pct">{pct}%</span>
          <span className="frac">{done}/{total}</span>
        </div>
      </div>
      {children}
    </section>
  );
}

function renderCrumb(crumb) {
  if (!crumb) return null;
  const parts = crumb.split(" / ");
  if (parts.length === 1) return <span className="leaf">{parts[0]}</span>;
  const head = parts.slice(0, -1).join(" / ");
  const leaf = parts[parts.length - 1];
  return <>{head}&nbsp;&nbsp;/&nbsp;&nbsp;<span className="leaf">{leaf}</span></>;
}

// LeetCode's own GraphQL endpoint doesn't return CORS headers, so fetch the
// daily slug from a public mirror (leetcode-api-pied) and cache it for the
// rest of the day. Falls back to the daily filter page on any failure.
function DailyLeetCodeLink() {
  const FALLBACK = "https://leetcode.com/problemset/?daily=true";
  const todayUTC = () => new Date().toISOString().slice(0, 10);
  const getCached = () => {
    const c = loadJSON("lc-daily", null);
    return c && c.date === todayUTC() ? c.url : null;
  };

  const handleClick = (e) => {
    e.preventDefault();
    const cached = getCached();
    if (cached) {
      window.open(cached, "_blank", "noopener");
      return;
    }
    const win = window.open("about:blank", "_blank", "noopener");
    const finish = (url) => {
      if (win) win.location.href = url;
      else window.open(url, "_blank", "noopener");
    };
    fetch("https://leetcode-api-pied.vercel.app/daily")
      .then((r) => r.json())
      .then((d) => {
        const path = d && d.link;
        const url = path ? "https://leetcode.com" + path : FALLBACK;
        if (path) saveJSON("lc-daily", { date: todayUTC(), url });
        finish(url);
      })
      .catch(() => finish(FALLBACK));
  };

  return (
    <a
      className="lc-daily"
      href={getCached() || FALLBACK}
      target="_blank"
      rel="noopener noreferrer"
      title="Open today's LeetCode Daily Challenge in a new tab"
      onClick={handleClick}
    >
      <span className="lc-daily-badge">LC</span>
      <span className="lc-daily-label">Daily LeetCode</span>
      <span className="lc-daily-arrow">↗</span>
    </a>
  );
}

function relTime(ts) {
  if (!ts) return "";
  const diff = Math.max(0, Date.now() - ts) / 1000;
  if (diff < 60) return "just now";
  if (diff < 3600) return Math.floor(diff / 60) + "m ago";
  if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
  const days = Math.floor(diff / 86400);
  if (days === 1) return "yesterday";
  if (days < 7) return days + "d ago";
  if (days < 30) return Math.floor(days / 7) + "w ago";
  return Math.floor(days / 30) + "mo ago";
}

function ExploringPanel({ go }) {
  const { map, remove, touch, setNote } = useExploring();
  const [editingId, setEditingId] = useState(null);
  const [draft, setDraft] = useState("");
  const entries = Object.entries(map).sort((a, b) => (b[1].at || 0) - (a[1].at || 0));
  if (entries.length === 0) return null;
  const vg = viewGroups();
  const findView = (grp) => {
    for (const [v, gs] of Object.entries(vg)) if (gs.includes(grp)) return v;
    return null;
  };
  const startEdit = (id, note) => { setDraft(note || ""); setEditingId(id); };
  const commitEdit = (id) => { setNote(id, draft); setEditingId(null); };
  return (
    <div className="exploring-panel">
      <div className="exploring-head">
        <span>Currently exploring</span>
        <span className="exploring-count">{entries.length}</span>
      </div>
      <ul>
        {entries.map(([id, meta]) => {
          const view = findView(meta.group);
          const isEditing = editingId === id;
          return (
            <li key={id} className="exploring-li">
              <div className="exploring-row">
                <button
                  className="exploring-item"
                  onClick={() => { if (view) { touch(id); go(view); } }}
                  title={meta.name + (view ? "" : " (no destination view)")}
                  disabled={!view}
                >
                  {meta.name}
                </button>
                <button
                  className={"exploring-note-btn " + (meta.note ? "has-note" : "")}
                  onClick={() => isEditing ? commitEdit(id) : startEdit(id, meta.note)}
                  title={meta.note ? "Edit 'where I left off' note" : "Add a 'where I left off' note"}
                  aria-label="Edit note"
                >✎</button>
                <button
                  className="exploring-x"
                  onClick={() => remove(id)}
                  title="Remove from currently exploring"
                  aria-label="Remove"
                >×</button>
              </div>
              {isEditing ? (
                <input
                  className="exploring-note-input"
                  autoFocus
                  type="text"
                  value={draft}
                  placeholder="where I left off…"
                  onChange={(e) => setDraft(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === "Enter") commitEdit(id);
                    else if (e.key === "Escape") setEditingId(null);
                  }}
                  onBlur={() => commitEdit(id)}
                />
              ) : (
                <div className="exploring-meta">
                  <span className="exploring-when">{relTime(meta.at)}</span>
                  {meta.note && <span className="exploring-note" title={meta.note}>· {meta.note}</span>}
                </div>
              )}
            </li>
          );
        })}
      </ul>
    </div>
  );
}

function ThemeToggle() {
  const [theme, setTheme] = useState(() =>
    document.documentElement.dataset.theme === "dark" ? "dark" : "light"
  );
  const flip = () => {
    const next = theme === "dark" ? "light" : "dark";
    if (next === "dark") document.documentElement.dataset.theme = "dark";
    else delete document.documentElement.dataset.theme;
    try { localStorage.setItem("sre:theme", next); } catch (e) {}
    setTheme(next);
  };
  return <button onClick={flip} title="Toggle dark / light mode">{theme === "dark" ? "light mode" : "dark mode"}</button>;
}

function App() {
  const [view, setView] = useState(() => (location.hash.replace("#", "") || DEFAULT_VIEW));
  useEffect(() => {
    const onHash = () => setView(location.hash.replace("#", "") || DEFAULT_VIEW);
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  const go = (id) => {
    location.hash = id;
    window.scrollTo(0, 0);
  };

  const all = useAllProgress();
  const vg = viewGroups();
  const sidebarPct = (id) => {
    const groups = vg[id];
    if (!groups || groups.length === 0) return null;
    let d = 0, t = 0;
    groups.forEach(g => { d += all.groups[g]?.done || 0; t += all.groups[g]?.total || 0; });
    if (t === 0) return null;
    return Math.round(d / t * 100);
  };

  const current = NAV.find(n => n.id === view);
  const Current = VIEW_MAP[view] || OverviewView;

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="brand">SRE Notebook<span className="dot">.</span></div>

        <DailyLeetCodeLink />

        <div className="search" title="Search not wired yet">
          <span className="kbd-hint">⌘K</span> search…
        </div>

        <ExploringPanel go={go} />

        <nav className="nav">
          {NAV.map(n => {
            if (n.group === "section") {
              return <div key={n.id} className="nav-group-label">{n.label}</div>;
            }
            const pct = sidebarPct(n.id);
            return (
              <button key={n.id}
                className={"nav-item " + (view === n.id ? "active" : "")}
                onClick={() => go(n.id)}
              >
                <span>{n.label}</span>
                {pct !== null && <span className="mini-bar">{pct}%</span>}
              </button>
            );
          })}
        </nav>

        <div className="sidebar-foot">
          Saved in your browser ·
          <button onClick={() => {
            if (confirm("Export all progress to clipboard as JSON?")) {
              const dump = {};
              for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && k.startsWith("sre:")) dump[k] = localStorage.getItem(k);
              }
              navigator.clipboard.writeText(JSON.stringify(dump, null, 2));
              alert("Copied to clipboard!");
            }
          }}>export</button>
          {' · '}
          <ThemeToggle />
        </div>
      </aside>

      <main className="main">
        {current?.crumb && <div className="crumb">{renderCrumb(current.crumb)}</div>}
        <Current />
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
